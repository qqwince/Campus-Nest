/* ---------- site shell ---------- */
:root{--hdr:calc(58px + env(safe-area-inset-top,0px));--ftr:calc(36px + env(safe-area-inset-bottom,0px))}
.sb{position:sticky;top:0;z-index:30;height:var(--hdr);padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;gap:8px;background:var(--page);border-bottom:1px solid var(--page-line)}
.sb-logo{display:flex;align-items:center;gap:9px;min-height:44px;font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--page-ink)}
.sb-mark{width:30px;height:30px;border-radius:50%;background:#5A63E8;color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.sb-sp{flex:1}
.sb-seg{display:flex;background:var(--page-card);border:1px solid var(--page-line);border-radius:12px;padding:3px}
.sb-seg button{min-height:44px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--page-muted)}
.sb-seg button.on{background:var(--primary);color:var(--on-primary)}
.sb-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px;border:1px solid var(--page-line);background:var(--page-card);color:var(--page-ink)}
.sb-go{min-height:44px;padding:0 16px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:14px;white-space:nowrap}
.sb-go.g{background:var(--page-card);color:var(--page-ink);border:1px solid var(--page-line)}
@media (max-width:430px){.sb{padding-left:10px;padding-right:10px;gap:6px}.sb.inapp .sb-wm{display:none}.sb-seg button{padding:0 10px}.sb-go{padding:0 12px}}
.sfoot{display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px env(safe-area-inset-bottom,0px);height:var(--ftr);font-size:12.5px;color:var(--page-muted);border-top:1px solid var(--page-line)}
.sfoot.land{margin-top:32px}
@media (max-width:899px){.sfoot:not(.land){display:none}:root:has(.sb.inapp){--ftr:0px}}
.wscreen.wauth .authcol{padding-bottom:24px!important}
.app{position:relative;width:100%;height:calc(100vh - var(--hdr) - var(--ftr));height:calc(100dvh - var(--hdr) - var(--ftr));display:flex;flex-direction:column;min-height:0}
.app.wide{max-width:1200px;margin:0 auto;min-height:560px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.wscreen.wauth{background:var(--page);align-items:flex-start;justify-content:center;padding:28px 24px;overflow:auto}
.wscreen.wauth>.wmain{flex:none;width:100%;max-width:460px;min-height:0;background:var(--navy);color:var(--text);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;margin:auto 0}
.wscreen.wauth .authcol{width:100%!important;padding:0!important}
.wscreen.wauth .body{overflow:visible}
.wscreen.wauth .pad{padding:4px 28px 32px}
.wscreen.wauth .top{padding-left:28px;padding-right:28px}
.wscreen.wauth .step{margin:0 28px 16px}
.screen{position:relative;width:100%;flex:1;min-height:0;overflow:hidden;background:var(--navy);color:var(--text);display:flex;flex-direction:column}
.wscreen{flex:1;display:flex;background:var(--navy);color:var(--text);min-height:0;position:relative}
.side{width:236px;flex:none;background:var(--s1);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side .brand{font-family:var(--head);font-weight:700;font-size:19px;padding:0 10px 4px}
.side .who{font-size:12.5px;color:var(--peri);padding:0 10px 18px}
.side button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;font-size:14.5px;color:var(--muted);text-align:left}
.side button.on{background:var(--sel);color:var(--text);font-weight:600}
.side button:hover{color:var(--text)}
.wmain{flex:1;display:flex;flex-direction:column;min-width:0}
.wtop{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line)}
.wtop .t{font-family:var(--head);font-weight:500;font-size:20px;flex:1}
.wbody{flex:1;overflow:auto;padding:24px 28px 40px}
.wbody .cnt{max-width:760px}
.wbody .cnt.wide{max-width:none}

/* ---------- app content ---------- */
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:4px 20px 28px}
.top{display:flex;align-items:center;gap:12px;padding:6px 20px 14px}
.top h1,.h1{font-family:var(--head);font-weight:500;font-size:22px;line-height:1.2;margin:0;letter-spacing:-.01em}
.top .sub{font-size:13px;color:var(--muted);margin-top:3px}
.back{width:44px;height:44px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}
.icon{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--s1);display:grid;place-items:center;position:relative;flex:none}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid var(--s1)}
h3{font-size:15px;font-weight:600;margin:22px 0 10px}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}
button.small{min-height:44px;display:inline-flex;align-items:center}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:var(--elev)}
.card.flat{border-color:transparent}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list{display:flex;flex-direction:column;gap:10px}
.tap{transition:transform .12s ease}
.tap:active{transform:scale(.98)}
.item{display:flex;align-items:center;gap:14px;background:var(--s1);border-radius:var(--r-lg);padding:14px;text-align:left;width:100%;box-shadow:var(--elev)}
.item .t{font-weight:600;font-size:var(--fs-md)}
.item .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-weight:600;font-size:16px;width:100%;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--primary);color:var(--on-primary)}
.btn.g{border:1.5px solid var(--primary);color:var(--peri)}
.btn.s{background:var(--s2);color:var(--text)}
.btn.d{border:1.5px solid var(--coral);color:var(--coral)}
.btn.m{background:var(--mint);color:var(--on-mint)}
.btn.sm{height:44px;font-size:14px;border-radius:22px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:16px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border-radius:12px;font-weight:600;font-size:14px}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:22px;border:1px solid var(--line-ui);font-size:var(--fs-sm);color:var(--peri);background:transparent;white-space:nowrap}
.chip.on{background:var(--chip-on);border-color:var(--peri);color:var(--text)}
.chip.warn{border-color:var(--coral);color:var(--coral)}
.chip.warn.on{background:color-mix(in srgb,var(--coral) 20%,transparent);color:var(--text)}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.amber.on{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600}
.pill.mint{background:color-mix(in srgb,var(--mint) var(--tint),transparent);color:var(--mint)}
.pill.amber{background:color-mix(in srgb,var(--amber) var(--tint),transparent);color:var(--amber)}
.pill.coral{background:color-mix(in srgb,var(--coral) var(--tint),transparent);color:var(--coral)}
.pill.peri{background:color-mix(in srgb,var(--peri) var(--tint),transparent);color:var(--peri)}
.pill.lilac{background:color-mix(in srgb,var(--lilac) var(--tint),transparent);color:var(--lilac)}
.ai{background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:var(--r-md);padding:var(--sp-3) 14px}
.ai .k{font-size:12px;font-weight:700;color:var(--lilac);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ai p{margin:0;font-size:13.5px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.inp{height:50px;border-radius:var(--r-sm);background:var(--s1);border:1px solid var(--field);padding:0 14px;font-size:var(--fs-input);outline:none;width:100%}
.inp:focus{border-color:var(--peri)}
.inp:focus-visible,.otp input:focus-visible,.composer input:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
textarea.inp{height:96px;padding:12px 14px;resize:none}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line-ui);position:relative;flex:none;transition:background .2s}
.switch::before{content:"";position:absolute;inset:-8px -4px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--thumb);transition:transform .2s}
.switch.on{background:var(--mint)}
.switch.on::after{transform:translateX(18px)}
.otp{display:flex;gap:6px}
.otp input{flex:1;min-width:0;max-width:46px;width:auto;height:56px;border-radius:14px;background:var(--s1);border:1px solid var(--field);text-align:center;font-size:22px;font-weight:700;outline:none}
.otp input:focus{border-color:var(--peri)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--mint);transition:width .6s ease}
.kv{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .h1{color:var(--text);margin-bottom:8px;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:var(--s1);border-radius:var(--r-md);padding:var(--sp-3);box-shadow:var(--elev)}
.kpi b{display:block;font-family:var(--head);font-weight:500;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.photo{position:relative;border-radius:16px;overflow:hidden;background:var(--s2)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo .lbl{position:absolute;left:8px;bottom:8px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(11,10,46,.7);padding:3px 8px;border-radius:8px}
.photo .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(11,10,46,.75);color:#fff;display:grid;place-items:center;font-size:14px}
.add{position:relative;border:1.5px dashed var(--peri);border-radius:16px;display:grid;place-items:center;color:var(--peri);font-size:13px;font-weight:600;cursor:pointer;text-align:center;padding:6px}
.add input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.add:focus-within{outline:2px solid var(--peri);outline-offset:2px}
.av{border-radius:50%;overflow:hidden;flex:none;background:var(--s2)}
.av img{width:100%;height:100%;display:block}
.stack{display:flex}
.stack .av{border:2px solid var(--s1);margin-left:-10px}
.stack .av:first-child{margin-left:0}
.tag{font-size:11px;font-weight:700;color:var(--peri);opacity:.85}

/* tabbar */
.tabbar{flex:none;height:calc(84px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 var(--line);background:var(--s1);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(18px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);position:relative}
.tabbar button.on{color:var(--text);font-weight:600}
.tabbar button.on .icon{stroke:var(--peri)}
.tabbar .badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:var(--on-coral);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* overlays */
.ov{position:absolute;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;animation:fade .2s ease}
.sheet{position:relative;width:100%;max-height:88%;overflow:auto;background:var(--s1);box-shadow:var(--shadow);border-radius:26px 26px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
.sheet .h1{padding-right:44px}
.sh-x{position:absolute;top:6px;right:8px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet .h1{margin-bottom:6px}
.web .ov{align-items:center;justify-content:center}
.web .sheet{width:min(480px,calc(100% - 24px));border-radius:24px;max-height:86%}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:absolute;left:50%;transform:translateX(-50%);width:max-content;bottom:100px;z-index:60;background:var(--toast-bg);color:var(--toast-ink);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:86%;text-align:center;animation:up .25s ease}
.web .toast{bottom:32px}
.lb{position:absolute;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
.lb img{flex:1;min-height:0;object-fit:contain;width:100%}
.lb .bar2{display:flex;justify-content:space-between;align-items:center;padding:56px 18px 14px;color:#fff}
.lb .nav{display:flex;justify-content:space-between;padding:14px 18px 30px}
.lb .nav button{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
.ext{position:absolute;inset:0;z-index:80;background:#F4F4F6;color:#1B1B1F;display:flex;flex-direction:column;animation:fade .2s}
.ext .eh{background:#E4002B;color:#fff;padding:56px 20px 18px;font-weight:700;font-size:20px}
.ext .eb{flex:1;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.ext .ecard{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ext .ebtn{height:54px;border-radius:14px;background:#E4002B;color:#fff;font-weight:700;font-size:16px}
.ext.halyk .eh,.ext.halyk .ebtn{background:#00805A}
.ext.egov .eh,.ext.egov .ebtn{background:#1F5BBF}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(0,0,0,.12);border-top-color:currentColor;animation:rot .8s linear infinite;margin:20px auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* swipe */
.deck{position:relative;height:540px;height:clamp(440px,62dvh,560px);margin:0 20px}
.scard{position:absolute;inset:0;border-radius:var(--r-xl);background:var(--s1);border:1px solid var(--line);box-shadow:var(--elev);overflow:hidden;touch-action:pan-y;user-select:none;display:flex;flex-direction:column}
.scard.under{transform:scale(.95) translateY(14px);opacity:.6}
.scard .ph{height:230px;flex:none;position:relative}
.scard .ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.score{position:absolute;top:14px;right:14px;background:rgba(11,10,46,.82);border:1px solid #6FD6A0;color:#6FD6A0;font-weight:700;font-size:14px;padding:6px 12px;border-radius:16px}
.stamp{position:absolute;top:30px;padding:6px 14px;border-radius:10px;font-family:var(--head);font-size:22px;border:3px solid;transform:rotate(-12deg);opacity:0}
.stamp.like{left:20px;color:var(--mint)}
.stamp.nope{right:20px;color:var(--coral);transform:rotate(12deg)}
.sact{display:flex;justify-content:center;gap:26px;margin:12px 0 8px;padding:8px 0;position:sticky;bottom:0;z-index:5;background:linear-gradient(180deg,transparent,var(--navy) 35%)}
.round{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px}
.round.n{border:2px solid var(--coral);color:var(--coral);background:var(--s1)}
.round.y{background:var(--primary);color:var(--on-primary)}

/* gallery */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:none;width:100%;scroll-snap-align:start}
.dots{display:flex;gap:6px;justify-content:center;position:absolute;bottom:12px;left:0;right:0}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.lcard{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;text-align:left;width:100%;box-shadow:var(--elev)}
.lcard-open{text-align:left;font:inherit}
.lcard-open::after{content:"";position:absolute;inset:0}
.lcard .ph{height:170px;position:relative}
.lcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .in{padding:12px 14px 14px}
.heart{position:absolute;z-index:2;top:6px;right:6px;width:44px;height:44px;border-radius:50%;background:rgba(11,10,46,.72);color:#fff;display:grid;place-items:center}
.heart.on .icon{fill:#FF8A80;stroke:#FF8A80}
.pill.promo{color:#F6C667}
.promo{position:absolute;top:12px;left:12px}
.price{font-family:var(--head);font-weight:500;font-size:18px}
.mapbox{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);padding:3px 7px;border-radius:11px;background:var(--s1);border:1px solid var(--peri);font-size:11px;font-weight:700;white-space:nowrap}
.pin.on{background:var(--primary);border-color:#fff;color:var(--on-primary)}
.bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4}
.bubble.in{background:var(--s1);box-shadow:var(--elev);align-self:flex-start;border-bottom-left-radius:6px}
.bubble.out{background:var(--primary);color:var(--on-primary);align-self:flex-end;border-bottom-right-radius:6px}
.composer{flex:none;display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--navy);border-top:1px solid var(--line)}
.composer input{flex:1;height:46px;border-radius:23px;background:var(--s1);border:1px solid var(--field);padding:0 16px;outline:none;font-size:var(--fs-input)}
.send{width:46px;height:46px;border-radius:50%;background:var(--primary);display:grid;place-items:center;color:var(--on-primary)}
.step{display:flex;gap:6px;margin:0 20px 16px}
.step i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.step i.on{background:var(--primary)}
.timeline{position:relative;padding-left:26px}
.timeline .tl{position:relative;padding:0 0 18px}
.timeline .tl::before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--navy)}
.timeline .tl::after{content:"";position:absolute;left:-15px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline .tl:last-child::after{display:none}
.timeline .tl.done::before{background:var(--mint);border-color:var(--mint)}
.timeline .tl.now::before{border-color:var(--amber);background:var(--amber)}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;color:var(--line-ui);min-width:44px;min-height:44px}
.stars button.on{color:var(--amber)}
.ring{width:150px;height:150px;margin:6px auto 10px;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:40px;font-weight:500}
.slot{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px}
.slot.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent)}
.slot b{display:block;font-size:15px}
.qr{width:150px;height:150px;background:#fff;border-radius:12px;padding:10px;margin:8px auto}
.range2{position:relative;height:30px}
.range2 input{position:absolute;inset:0;width:100%;pointer-events:none;appearance:none;-webkit-appearance:none;background:none;margin:0}
.range2 input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--thumb);border:1px solid var(--line-ui);cursor:pointer}
.range2 input::-moz-range-thumb{pointer-events:auto;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--thumb);border:1px solid var(--line-ui);cursor:pointer}
.range2 .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--line)}
.range2 .fill{position:absolute;top:12px;height:6px;border-radius:3px;background:var(--primary)}
.lvl{width:46px;height:46px;border-radius:50%;background:var(--s1);border:1px solid var(--line);font-weight:700}
.lvl.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.acc{border-bottom:1px solid var(--line);padding:14px 0}
.acc summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;min-height:44px;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--peri);font-size:20px}
.acc[open] summary::after{content:"–"}
.acc p{color:var(--muted);font-size:14px;line-height:1.5;margin:8px 0 0}

@media (hover:hover){
  .item:hover{background:var(--s2)}
  .lcard:hover{border-color:var(--peri)}
  .btn.s:hover{background:var(--s3)}
  .chip:hover{border-color:var(--peri)}
}
/* web adjustments */
.web .pad{padding:0}
.web .wtop~.wbody .top .back,.web .wtop~.wbody .top:not(.chat-top) h1{display:none}
.web .wtop~.wbody .top{padding-left:0;padding-right:0}
.web .hide-web{display:none!important}
.web .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.web .split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.web .deck{max-width:420px;margin:0 auto}
.show-web{display:none}
.web .show-web{display:block}

@media (max-width:1100px){
  .web .split{grid-template-columns:1fr}
}
/* ---------- AI showcase (hero) ---------- */
.aih{max-width:1240px;margin:0 auto;padding:20px 24px 0}
.aih-in{position:relative;overflow:hidden;border-radius:28px;background:var(--hero-bg);color:var(--text);border:1px solid var(--line);padding:44px 40px 36px;box-shadow:var(--hero-shadow)}
.aih-top{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.aih-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--lilac) var(--tint),transparent);color:var(--lilac);font-weight:700;font-size:13px}
.aih-eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 color-mix(in srgb,var(--mint) 70%,transparent);animation:aihPulse 2s infinite}
.aih-eyebrow .dot.off{background:var(--amber);animation:none}
@keyframes aihPulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.aih h1{font-family:var(--head);font-weight:700;font-size:clamp(30px,4.4vw,52px);line-height:1.04;letter-spacing:-.02em;margin:16px 0 14px}
.aih h1 em{font-style:normal;background:linear-gradient(90deg,var(--peri),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.aih-lead{font-size:17px;line-height:1.55;color:var(--muted);margin:0 0 22px;max-width:560px}
.aih-cta{display:flex;gap:12px;flex-wrap:wrap}
.aih-btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:14px;font-weight:700;font-size:15px;transition:transform .15s,background .15s}
.aih-btn.p{background:var(--primary);color:var(--on-primary)}.aih-btn.p:hover{background:var(--primary-hover);transform:translateY(-1px)}
.aih-btn.g{border:1px solid var(--line-ui);color:var(--text);background:var(--glass)}.aih-btn.g:hover{background:var(--glass-2)}
.aih-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:26px}
.aih-stats div{font-size:13px;color:var(--muted);line-height:1.3}.aih-stats b{display:block;font-family:var(--head);font-size:22px;color:var(--text);margin-bottom:2px}
/* demo card */
.aih-demo{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--elev);border-radius:22px;padding:18px;backdrop-filter:blur(6px)}
.aih-demo-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--lilac);letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.aih-who{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.aih-who button{min-height:44px;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:13px;font-weight:600;color:var(--text)}
.aih-who button img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.aih-who button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.aih-row{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center;margin-bottom:14px}
.aih-ring{position:relative;width:92px;height:92px}
.aih-ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.aih-ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--head);font-size:18px;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.aih-ring b small{font-family:var(--body);font-size:9px;letter-spacing:.06em;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.aih-bars{display:grid;gap:6px}
.aih-bar{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.aih-bar i{display:block;height:6px;border-radius:4px;background:var(--hair);overflow:hidden}
.aih-bar i s{display:block;height:100%;border-radius:4px;transition:width .5s}
.aih-tag{font-size:11px;font-weight:700;color:var(--muted);margin:0 0 6px;letter-spacing:.04em;text-transform:uppercase}
/* sections */
.aih-sec{margin-top:34px}
.aih-sec h2{font-family:var(--head);font-size:20px;margin:0 0 4px}
.aih-sec>p{margin:0 0 16px;color:var(--muted);font-size:14px}
.aih-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch}
.aih-step{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--elev)}
.aih-step .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--peri) 20%,transparent);color:var(--peri);font-weight:800;font-size:13px;margin-bottom:8px}
.aih-step b{display:block;font-size:15px;margin-bottom:4px}.aih-step span{font-size:13px;line-height:1.45;color:var(--muted)}

.aih-card code{font-size:11px;color:var(--peri);font-weight:700}
.aih-card .ic{flex:none;width:38px}.aih-card b{font-size:15px}.aih-card .d{font-size:13px;line-height:1.45;color:var(--muted);flex:1}
.aih-card em{font-style:normal;color:var(--peri);font-weight:700;font-size:13px}
.aih-trust{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.aih-trust span{display:inline-flex;align-items:center;gap:7px}.aih-trust svg{color:var(--mint)}
.aih-eyebrow .dot{position:static;top:auto;right:auto;border:0;flex:none}
@media(max-width:700px){.aih-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.aih-lead{font-size:15px;margin-bottom:16px}.aih h1{margin:12px 0 10px}}
@media (max-width:1000px){.aih-top{grid-template-columns:1fr}.aih-cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.aih{padding:12px 12px 0}.aih-in{padding:24px 16px 22px;border-radius:22px}.aih-flow{grid-template-columns:1fr}.aih-arrow{transform:rotate(90deg)}.aih-cards{grid-template-columns:1fr}.aih-btn{flex:1;justify-content:center}.aih-row{grid-template-columns:76px 1fr}.aih-ring,.aih-ring svg{width:76px;height:76px}}

.aix-col{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:88%}
.aix-b{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}

/* ===== Campus Nest v3-F: typography (Golos Text + Literata, embedded) and 3D controls ===== */
:root{--head:'Literata',Georgia,'Times New Roman',serif;--body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fs-xs:13px;--fs-sm:14px;--fs-md:16px}
body{font-family:var(--body);font-size:16px;line-height:1.55;font-kerning:normal;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea,select{font-family:inherit}
h3{font-size:16px;line-height:1.35}
/* headings: warm serif, calm tracking, balanced wrapping */
.top h1,.h1,.aih h1,.pc-top h3,.po-h h2,.aih-sec h2,.wtop .t,.sb-logo,.side .brand{font-family:var(--head);font-weight:600;text-wrap:balance}
.top h1,.h1{font-size:24px;line-height:1.2;letter-spacing:-.005em}
.wtop .t{font-size:21px;letter-spacing:0}
.sb-logo{font-size:18px;letter-spacing:0}
.side .brand{font-size:20px;letter-spacing:0}
.po-h h2{font-size:20px}
.pc-top h3{font-size:22px;line-height:1.25}
.aih h1{font-size:clamp(32px,4.4vw,52px);line-height:1.1;letter-spacing:-.015em}
.aih h1 em{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--peri);font-style:normal}
.aih-sec h2{font-size:24px;line-height:1.25}
.empty .h1{font-size:20px}
/* big numbers and prices: lining, tabular */
.kpi b,.price,.pc-big,.ring b,.aih-ring b,.aih-stats b,.wi-sc,.stamp,.score,.pill,.pin,.pl2 i,.ps-ed,.h3-u b,.kv span:last-child,.slot b,.pc-amt,.aih-bar,.pr-n{font-variant-numeric:lining-nums tabular-nums}
.kpi b{font-size:22px;font-weight:600}
.kpi span{font-size:13px}
.price{font-weight:600;font-size:20px;white-space:nowrap}
.ring b{font-size:42px;font-weight:600}
.pc-big{font-size:28px}
.aih-stats b{font-size:24px;font-weight:600}
.aih-ring b{font-size:19px;letter-spacing:0}
.aih-ring b small{font-size:10.5px;letter-spacing:0;font-weight:600}
.wi-sc{font-size:17px}
.wi-sc small{font-size:13px}
.stamp{font-weight:600}
/* text sizes: body copy >= 15-16px, secondary >= 13-14px */
.item .t{font-size:16px}
.item .s{font-size:13.5px;line-height:1.45}
.pill{font-size:13px}
.ai .k{font-size:13px}
.ai p{font-size:15px;line-height:1.55}
.field label{font-size:14px}
.kv{font-size:15px}
.tag{font-size:12px}
.tabbar button{font-size:12px}
.tabbar .badge{font-size:11.5px}
.bubble{font-size:15.5px;line-height:1.5}
.acc p{font-size:15px;line-height:1.55}
.side .who{font-size:13.5px}
.side button{font-size:15px}
.sb-seg button{font-size:14px}
.sfoot{font-size:13.5px}
.photo .lbl{font-size:12.5px}
.slot{font-size:14px}
.pv-meta{font-size:13.5px}
.pv-lang button{font-size:13.5px}
.ph-ex button{font-size:14px;line-height:1.35}
.pv-box textarea{line-height:1.5}
.aih-eyebrow{font-size:14px}
.aih-lead{font-size:18px;line-height:1.6}
.aih-stats div{font-size:14px;line-height:1.35}
.aih-who button{font-size:14px}
.aih-bar{font-size:13px}
.aih-step b,.aih-card b{font-size:16px}
.aih-step span,.aih-card .d{font-size:14.5px;line-height:1.55}
.aih-card code{font-size:12px}
.aih-card em{font-size:14px}
.aih-sec>p{font-size:15.5px;line-height:1.55}
.aih-trust{font-size:14px}
.aih-tabs button{font-size:14px}
.pc-why{font-size:14.5px}
.pc-why li{line-height:1.45}
.pc-rule{font-size:14.5px;line-height:1.5}
.pc-rule small{font-size:13px}
.pc-letter textarea{font-size:15px;line-height:1.55}
.wi-c label,.wi-ch b{font-size:14px}
.xr-q,.xr-why{font-size:14px;line-height:1.5}
.xr-ch,.xr-n{font-size:12.5px}
.pr-cap{font-size:14.5px;line-height:1.4}
.pr-cap b{font-size:15.5px}
.pr-btns button{font-size:14px}
.h3-hint{font-size:13.5px}
.h3-stat{font-size:14.5px;line-height:1.45}
.h3-badge{font-size:12.5px}
.h3-chips button{font-size:14px}
.h3-card b{font-size:16px}
.h3-card .m{font-size:14px;line-height:1.4}
.h3-card .r button{font-size:14px}
.t3-top b{font-size:17px}.t3-top span{font-size:14px;opacity:.85}
.t3-foot button{font-size:15px}
.ps-st{font-size:14px}
.ps-st small{font-size:12.5px;color:#c4cbff}
.ps-chips span{font-size:13px}
.ps-skip{font-size:14px}
.ps-nd{font-size:13px}
.ps-ed{font-size:12.5px}
[style*="font-size:11.5px"],[style*="font-size:12.5px"],[style*="font-size:13px"]{font-size:14px!important}
/* calm labels instead of tracked uppercase */
.aih-demo-h,.ph-k,.pc-s>h4{text-transform:none;letter-spacing:0;font-size:14px;font-weight:700}
.aih-tag{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
.h3-u b{letter-spacing:0;font-size:12px}
.h3-lobby span{text-transform:none;letter-spacing:.02em;font-size:11px;font-weight:700}
/* line length */
.cnt p,.pad p,.aih-lead,.aih-sec>p{max-width:68ch}
/* softer glow on the demo building */
.h3-halo{opacity:.6}
.h3-u.on{box-shadow:0 0 0 2px #FFC857 inset,0 4px 14px rgba(255,200,87,.38)}
.h3-u.sel{box-shadow:0 0 0 3px var(--peri) inset,0 4px 16px color-mix(in srgb,var(--peri) 40%,transparent)}
.pl2 i{font-size:12px}
.pl2.best i{font-size:13px}

/* ===== 3D controls ===== */
.h3-rig{transform:rotateX(var(--rx,-16deg)) rotateY(var(--ry,-28deg)) scale(calc(var(--sc,1)*var(--zm,1)));will-change:auto}
.h3-scene{touch-action:pan-y;cursor:grab;outline:none}
.ps{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.t3-view{touch-action:none;cursor:grab}
.h3-scene.cn3-drag,.ps.cn3-drag,.t3-view.cn3-drag{cursor:grabbing}
.h3-scene:focus-visible,.ps:focus-visible,.t3-view:focus-visible{outline:3px solid var(--peri);outline-offset:-3px;border-radius:16px}
.cn3-ctl{position:absolute;right:8px;top:8px;z-index:6;display:flex;flex-direction:column;gap:4px;cursor:default}
.cn3-ctl button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--s1) 90%,transparent);color:var(--text);border:1px solid var(--line-ui);box-shadow:var(--elev);font-size:24px;line-height:1;font-weight:500;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cn3-ctl button:hover:not(:disabled){border-color:var(--peri)}
.cn3-ctl button:disabled{opacity:.4;cursor:default}
.cn3-ctl button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.cn3-ctl svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.cn3-ctl svg .f{fill:currentColor;stroke:none}
.ps .cn3-ctl{top:64px}
.t3-view .cn3-ctl{top:50%;transform:translateY(-50%)}
.ps .cn3-ctl button,.t3 .cn3-ctl button{background:rgba(12,10,50,.8);color:#fff;border-color:rgba(255,255,255,.32);box-shadow:none}
.ps .cn3-ctl button[aria-pressed="true"],.t3 .cn3-ctl button[aria-pressed="true"]{background:#fff;color:#17143F;border-color:#fff}

const BASEW = {sleep:1.2,clean:1,smoke:1.3,guests:1,pets:.6,budget:1};
function sims(a,b){
  const ov = Math.max(0, Math.min(a.budget[1],b.budget[1]) - Math.max(a.budget[0],b.budget[0]));
  const rng = Math.min(a.budget[1]-a.budget[0], b.budget[1]-b.budget[0]) || 1;
  return {
    sleep: 1 - Math.abs(a.sleep-b.sleep)/2,
    clean: 1 - Math.abs(a.clean-b.clean)/4,
    smoke: a.smoke===b.smoke ? 1 : (a.smoke==='outside'||b.smoke==='outside') ? .5 : 0,
    guests: 1 - Math.abs(a.guests-b.guests)/2,
    pets: ((a.pets==='none'&&b.pets==='has')||(a.pets==='has'&&b.pets==='none')) ? 0 : 1,
    budget: Math.min(1, ov/rng)
  };
}
function weights(){ const w={}; for(const k in BASEW) w[k]=BASEW[k]*ST.wmul[k]*(ST.notImp[k]?.25:1); return w; }
/* Weighted fit r in 0..1 (1 = identical habits), stretched with r^1.25 so the whole 0..100 range is used:
   identical habits are about 100, clashing habits drop below 50 instead of staying near 50. */
function score(a,b){ const s=sims(a,b), w=weights(); let n=0,d=0; for(const k in s){n+=s[k]*w[k];d+=w[k];} return Math.round(100*Math.pow(n/d,1.25)); }

  const bad = Object.keys(s).filter(k=>s[k]<.5).sort((x,y)=>w[y]*(1-s[y])-w[x]*(1-s[x]));

  const badT = {sleep:`sleeps ${SLEEP[p.sleep].toLowerCase()}, you sleep ${SLEEP[ST.me.sleep].toLowerCase()}`,clean:`cleanliness ${p.clean}/5 vs your ${ST.me.clean}/5`,smoke:`${SMOKE[p.smoke].toLowerCase()}`,guests:`has guests ${GUESTS[p.guests].toLowerCase()}, you prefer ${GUESTS[ST.me.guests].toLowerCase()}`,pets:'pets do not fit',budget:`budget ${p.budget[0]}–${p.budget[1]}k barely overlaps yours`};
  let main = good.length ? `${p.name} is ${txt[good[0]]}${good[1]?` and ${txt[good[1]]}`:''}.` : `${p.name} differs from you in several habits.`;
  const top = good[0]||bad[0];

}

  return crossed;
}
function groupStats(){

  const TR={ali:74,mira:70,dana:73,aigerim:71,timur:69,aliya:72,nurlan:66,zhanel:68,arman:62}; const trustAvg = Math.round((ST.trust.score + ids.filter(x=>x!=='me').reduce((a,x)=>a+(TR[x]||68),0)) / ids.length);
  return {comp, risk, trustAvg: Math.min(99,trustAvg)};

function useDialog(ref,onEsc){
  const cb=useRef(onEsc); cb.current=onEsc;
  useEffect(()=>{
    const root=ref.current; const prev=document.activeElement;
    const sel='button:not([disabled]),input:not([disabled]),select,textarea,[tabindex="0"],a[href]';
    const first=root&&(root.querySelector('button:not(.sh-x):not([disabled]),[tabindex="0"],input:not([disabled]),select,textarea')||root.querySelector(sel));
    if(first) first.focus(); else if(root){root.setAttribute('tabindex','-1');root.focus();}
    const kd=e=>{
      if(e.key==='Escape'){e.stopPropagation();cb.current&&cb.current();return;}
      if(e.key==='Tab'&&root){const f=[...root.querySelectorAll(sel)].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
    };
    document.addEventListener('keydown',kd);
    return()=>{document.removeEventListener('keydown',kd);if(prev&&prev.focus&&document.contains(prev))prev.focus();};
  },[]);
}

  slots:({lid})=>{const L=LISTINGS.find(x=>x.id===lid); const slots=[['Sat','14:00'],['Sun','11:00'],['Mon','18:30'],['Tue','19:00']]; return html`<div class="h1">Book a viewing</div><p class="muted small">${L.title}, ${L.addr}. Slots come from the landlord’s calendar.</p><div class="grid2" style="margin:14px 0">${slots.map(([d,t])=>{const v=d+' '+t; return html`<button class=${'slot'+(ST.viewing[lid]===v?' on':'')} aria-pressed=${!!(ST.viewing[lid]===v)} onClick=${()=>set(s=>{s.viewing[lid]=v})}><b>${d}</b>${t}</button>`;})}</div><button class="btn p" disabled=${!ST.viewing[lid]} onClick=${()=>{closeSheet();toast('Viewing booked: '+ST.viewing[lid]+'. Serik will get a notification.');}}>Book viewing</button>`;},
  sign:()=>{const [m,setM]=useState('totp'); const [st,setSt]=useState(0); const done=()=>{closeSheet();signMine();}; return html`<div class="h1">Sign the contract</div><p class="muted small">Prototype: this signature is simulated and has no legal force. Choose how to confirm it.</p><div class="chips" style="margin:12px 0 16px"><button class=${'chip'+(m==='totp'?' on':'')} aria-pressed=${!!(m==='totp')} onClick=${()=>setM('totp')}>Authenticator code</button><button class=${'chip'+(m==='egov'?' on':'')} aria-pressed=${!!(m==='egov')} onClick=${()=>setM('egov')}>eGov digital signature</button></div>${m==='totp'? html`<div class="field"><label>6-digit code from your authenticator app</label><${OtpInput} onDone=${()=>{setSt(1);setTimeout(done,900);}}/></div>${st===1&&html`<div class="pill mint">${Ic('check',14)} Code verified, signing…</div>`}<p class="muted small">Tip: type any 6 digits in this demo.</p>` : html`<p class="muted small" style="line-height:1.5">You will be redirected to eGov Mobile. Campus Nest only receives the signed document.</p><button class="btn p" onClick=${()=>{closeSheet();egov('Lease contract CN-2026-0412',signMine);}}>Continue to eGov</button>`}`;},

  guest:()=>html`<div class="h1">Log in to apply</div><p class="muted" style="line-height:1.5">Guests can browse listings. To apply, book viewings or chat, create an account. It takes two minutes.</p><div class="col" style="margin-top:14px"><button class="btn p" onClick=${()=>{closeSheet();set(s=>{s.guest=false;s.stack.student=[{id:'P0'},{id:'P4'}]});}}>Create account</button><button class="btn g" onClick=${()=>{closeSheet();set(s=>{s.guest=false;s.stack.student=[{id:'P0'},{id:'P3'}]});}}>Log in</button></div>`,

  dispute:()=>{const [r,setR]=useState('Damage not shown in the listing'); const [t,setT]=useState(''); const n=Object.keys(ST.checkin.photos).length; return html`<div class="h1">Open a dispute</div><p class="muted small">The deposit stays in escrow until a moderator decides, within 5 working days.</p><div class="field" style="margin-top:12px"><label>Reason</label><select class="inp" aria-label="Reason" onChange=${e=>setR(e.target.value)}>${['Damage not shown in the listing','Flat does not match the photos','Appliances do not work','Other'].map(x=>html`<option selected=${x===r}>${x}</option>`)}</select></div><div class="field"><label>What happened</label><textarea class="inp" aria-label="What happened" placeholder="Describe the problem" value=${t} onInput=${e=>setT(e.target.value)}></textarea></div><div class="pill ${n?'mint':'amber'}" style="margin-bottom:14px">${n?`${n} check-in photos attached as evidence`:'Add check-in photos first: they are your evidence'}</div><button class="btn d" disabled=${!n} onClick=${()=>{closeSheet();set(s=>{s.checkin.dispute={r,at:'today'};});toast('Dispute opened. Deposit is frozen until a decision.');}}>Open dispute</button>`;},
  topup:()=>{const [a,setA]=useState(5000); return html`<div class="h1">Top up wallet</div><p class="muted small">Wallet money is used only for promotion.</p><div class="grid3" style="margin:14px 0">${[2000,5000,10000].map(v=>html`<button class=${'slot'+(a===v?' on':'')} aria-pressed=${!!(a===v)} onClick=${()=>setA(v)}><b>${fmt(v)}</b>KZT</button>`)}</div><button class="btn p" onClick=${()=>pay({amount:a,purpose:'Wallet top-up',onDone:()=>{set(s=>{s.ll.wallet+=a});toast('Wallet topped up by '+kzt(a));}})}>Top up ${kzt(a)}</button>`;},
  promote:({lid})=>{const [pk,setPk]=useState('top'); const P={top:['Top of search, 7 days',1500],hl:['Highlighted card, 7 days',900],feat:['Featured near campus, 14 days',2500]}; const cool = ST.ll.refreshAt>Date.now(); const L=LISTINGS.find(x=>x.id===lid); return html`<div class="h1">Promote listing</div><p class="muted small">${L.title}</p><div class="card flat" style="margin:12px 0;background:var(--s2)"><div class="between"><div><b>Free refresh</b><div class="muted small">${cool?'Used. Available again in 3 days':'Shows students you are actively looking'}</div></div><button class="btn sm g" disabled=${cool} onClick=${()=>{set(s=>{s.ll.refreshAt=Date.now()+3*864e5});toast('Listing refreshed. It moved up in search.');}}>Refresh</button></div></div><h3>Paid promotion</h3><div class="col">${Object.entries(P).map(([k,[n,p]])=>html`<button class="item" style=${pk===k?'outline:2px solid var(--amber)':''} onClick=${()=>setPk(k)}><span class="grow"><span class="t">${n}</span><div class="s">${kzt(p)} from wallet</div></span>${pk===k&&Ic('check',18)}</button>`)}</div><div class="between" style="margin:14px 0"><span class="muted">Wallet balance</span><b>${kzt(ST.ll.wallet)}</b></div>${ST.ll.wallet>=P[pk][1]? html`<button class="btn p" onClick=${()=>{set(s=>{s.ll.wallet-=P[pk][1];s.ll.promo[lid]=P[pk][0];});closeSheet();toast('Promotion started: '+P[pk][0]);}}>Pay ${kzt(P[pk][1])} and promote</button>` : html`<button class="btn g" onClick=${()=>sheet('topup')}>Top up wallet first</button>`}`;},
  iban:()=>{const [v,setV]=useState('KZ86 125K ZT50 0410 0100'); return html`<div class="h1">Change payout details</div><div class="ai" style="margin:10px 0 14px;border-color:var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent)"><div class="k" style="color:var(--amber)">${Ic('shield',15)} Safety hold</div><p>After you change the IBAN, payouts pause for 48 hours. This protects you if someone takes over your account.</p></div><div class="field"><label>New IBAN</label><input class="inp" aria-label="New IBAN" value=${v} onInput=${e=>setV(e.target.value)}/></div><button class="btn p" onClick=${()=>{closeSheet();set(s=>{s.ll.ibanHold=true});toast('IBAN saved. Payouts paused for 48 hours.');}}>Save IBAN</button>`;},
  reject:({aid})=>{const [r,setR]=useState('Already rented'); return html`<div class="h1">Reject application</div><p class="muted small">Students see the reason. Be polite and clear.</p><div class="chips" style="margin:12px 0 16px">${['Already rented','Group is too big','Dates do not fit','Requirements not met'].map(x=>html`<button class=${'chip'+(r===x?' on':'')} aria-pressed=${!!(r===x)} onClick=${()=>setR(x)}>${x}</button>`)}</div><button class="btn d" onClick=${()=>{closeSheet();setApp(aid,'rejected');toast('Application rejected. The students were notified.');}}>Reject application</button>`;},
  review:({target})=>{const [n,setN]=useState(5); const tags=['Clean flat','Quiet neighbours','Fast replies','As in photos','Fair deposit']; const [t,setT]=useState(['As in photos']); return html`<div class="h1">Review ${target||'your stay'}</div><p class="muted small">You can review only after a real contract. This keeps reviews honest.</p><div class="stars" style="margin:14px 0">${[1,2,3,4,5].map(i=>html`<button class=${i<=n?'on':''} aria-label=${i+' stars'} aria-pressed=${i===n} onClick=${()=>setN(i)}>★</button>`)}</div><div class="chips">${tags.map(x=>html`<button class=${'chip'+(t.includes(x)?' on':'')} aria-pressed=${!!(t.includes(x))} onClick=${()=>setT(t.includes(x)?t.filter(y=>y!==x):[...t,x])}>${x}</button>`)}</div><div class="field" style="margin-top:14px"><textarea class="inp" aria-label="Review comment" placeholder="Anything else future tenants should know?"></textarea></div><button class="btn p" onClick=${()=>{closeSheet();toast('Review published. Thank you!');}}>Publish review</button>`;},
  pwd:()=>html`<div class="h1">Change password</div><div class="field" style="margin-top:12px"><label>Current password</label><input class="inp" aria-label="Current password" type="password" value="password1"/></div><div class="field"><label>New password</label><input class="inp" aria-label="New password" type="password" placeholder="At least 10 characters"/></div><button class="btn p" onClick=${()=>{closeSheet();toast('Password changed. Other devices were signed out.');}}>Change password</button>`,
  del:()=>{const [v,setV]=useState(''); return html`<div class="h1">Delete account</div><p class="muted" style="line-height:1.5">Your profile, matches and documents will be deleted. Contracts are kept for 5 years as the law requires.</p><div class="field"><label>Type DELETE to confirm</label><input class="inp" aria-label="Type DELETE to confirm" value=${v} onInput=${e=>setV(e.target.value)}/></div><button class="btn d" disabled=${v!=='DELETE'} onClick=${()=>{closeSheet();toast('Account deletion requested. You have 14 days to change your mind.');}}>Delete my account</button>`;},
  doc:({kind})=>html`<div class="h1">${kind}</div><p class="muted small">Upload a clear photo or PDF. A moderator checks it, usually within a day. Scans of IDs are deleted after the check.</p><div style="margin:14px 0"><${AddPhoto} h=${120} label="Choose file" accept="image/*,.pdf" onFiles=${()=>{closeSheet();toast(kind+' uploaded. Status: pending review.');}}/></div>`

  </div></div>`;

function P4(){
  const o=ST.onb; const up=f=>set(s=>{f(s.onb)});
  const steps=['Role','Contacts','2FA',o.role==='student'?'Student card':'ID'];
  const [sent,setSent]=useState(false);
  const next=()=>{ if(o.step<3) up(x=>{x.step++}); else { if(o.role==='student'){ set(s=>{s.guest=false;s.stack.student=[{id:'S0'},{id:'S1.1',p:{first:true}}]}); toast('Account created. Tell us about your lifestyle.'); } else { set(s=>{s.role='landlord';s.stack.landlord=[{id:'L0'},{id:'L5'}]}); toast('Account created. Verify your identity to publish listings.'); } up(x=>{x.step=0}); } };
  const ok = [true, o.codes, o.tfa, !!o.card][o.step];
  return html`<div class="body"><${Top} title="Create account" sub=${`Step ${o.step+1} of 4 · ${steps[o.step]}`} onBack=${o.step>0?()=>up(x=>{x.step--}):null}/><div class="step">${steps.map((_,i)=>html`<i class=${i<=o.step?'on':''}></i>`)}</div><div class="pad">
    ${o.step===0&&html`<h3 style="margin-top:0">I am a…</h3><div class="grid2">${[['student','Student','Find a flat and roommates','users','var(--peri)'],['landlord','Landlord','Rent out a flat or rooms','house','var(--mint)']].map(([k,t,s,i,c])=>html`<button class="card tap" style=${`text-align:left;${o.role===k?'border-color:var(--primary);border-width:2px':''}`} onClick=${()=>up(x=>{x.role=k})}><div class="tile" style=${`background:color-mix(in srgb, ${c} 22%, transparent);color:${c};margin-bottom:12px`}>${Ic(i)}</div><b>${t}</b><div class="muted small" style="margin-top:4px">${s}</div></button>`)}</div><p class="muted small" style="margin-top:16px;line-height:1.5">One role per account. By continuing you accept the Terms and Privacy Policy. Your data is stored in Kazakhstan.</p>`}
    ${o.step===1&&html`<div class="field"><label>University email</label><input class="inp" aria-label="University email" value="aruzhan@astanait.edu.kz"/></div><div class="field"><label>Phone</label><input class="inp" aria-label="Phone" value="+7 701 555 24 12"/></div>${!sent? html`<button class="btn g" onClick=${()=>setSent(true)}>Send codes</button>` : html`<div class="field"><label>Code from email and SMS</label><${OtpInput} n=${4} onDone=${()=>{up(x=>{x.codes=true});toast('Email and phone verified');}}/></div>${o.codes&&html`<span class="pill mint">${Ic('check',14)} Verified</span>`}`}`}
    ${o.step===2&&html`<p class="muted" style="line-height:1.5;margin-top:0">Scan this code with Google Authenticator or any TOTP app, then enter the 6-digit code.</p><img class="qr" src=${qrArt()} alt="QR code for the authenticator app"/><div class="field"><label>6-digit code</label><${OtpInput} onDone=${()=>{up(x=>{x.tfa=true});toast('Two-factor login is on');}}/></div>${o.tfa&&html`<span class="pill mint">${Ic('check',14)} 2FA enabled</span>`}`}
    ${o.step===3&&html`<p class="muted" style="line-height:1.5;margin-top:0">${o.role==='student'?'Upload your student card. A moderator checks it (A2.1). Only verified students can apply for flats.':'Upload your ID. Then you will add ownership documents for each property.'}</p>${o.card? html`<${Photo} src=${o.card} h=${190} label="Uploaded" onRemove=${()=>up(x=>{x.card=null})}/><span class="pill amber" style="margin-top:10px">Pending moderator review</span>` : html`<${AddPhoto} h=${190} multiple=${false} label=${o.role==='student'?'Upload student card':'Upload ID'} onFiles=${fs=>up(x=>{x.card=fs[0].src})}/><button class="small" style="color:var(--peri);margin-top:10px" onClick=${()=>up(x=>{x.card=room('bedroom',3)})}>Use a sample image (demo)</button>`}`}
    <button class="btn p" style="margin-top:24px" disabled=${!ok} onClick=${next}>${o.step<3?'Continue':'Finish'}</button>${o.step>0&&html`<button class="btn s" style="margin-top:10px" onClick=${()=>up(x=>{x.step--})}>Back</button>`}
  </div></div>`;
}

  if(ST.lease){ steps.push(['camera','Check in with photos','Protects your deposit','S5.2',{},'var(--amber)']); steps.push(['wallet','Pay rent for October',kzt(Math.round(LISTINGS.find(x=>x.id===ST.lease.lid).price/ST.group.members.length)),'S5.1',{},'var(--mint)']); }
  else if(a&&a.status==='approved') steps.push(['doc','Sign your lease contract','Approved by Serik','M3.1',{},'var(--mint)']);
  else if(a) steps.push(['cal','Application sent','Waiting for the landlord','S4.3',{},'var(--amber)']);

  if(!a) steps.push(['house','Viewing booked',`${ST.viewing.l1||'Pick a slot'} · Kabanbay Batyr 37`,'S2.3',{id:'l1'},'var(--amber)']);
  return html`<div class="body"><div class="pad" style="padding-top:8px">
    <div class="between hide-web"><div class="row"><${Av} id="me" size=${48}/><div><div class="h1">Hi, Aruzhan</div><div class="muted small">AITU, Software Engineering</div></div></div><div class="row" style="gap:8px"><button class="iconbtn" aria-label="Profile" onClick=${()=>nav('S7')}>${Ic('user')}</button><button class="iconbtn" aria-label="Notifications" onClick=${()=>nav('M2.1')}>${Ic('bell')}${unread?html`<span class="dot"></span>`:''}</button></div></div>

/* ================= LIVE AI: Claude via the artifact `sample` capability ================= */
let PROVIDER=null, aiBlockedUntil=0;
const AI_META=(document.querySelector('meta[name="cn-ai-endpoint"]')?.content||'').trim();
const AI_URL=AI_META || (/\.(workers|pages)\.dev$/.test(location.hostname) ? '/api/ai' : '');
ST.ai={mode:'loading',cache:{},pending:{},name:'',srcs:{},last:null,health:null,ping:null};
let AI_TIMEOUT=12000;
const AI_ERR={rate_limited:'rate limit',queue_overflow:'rate limit',not_granted:'no access',timeout:'timeout',invalid_json:'invalid answer',network:'network error',upstream_error:'upstream error'};
const aiErrText=e=>{ const c=e&&e.code; return AI_ERR[c]||(c?String(c).replace(/_/g,' '):'error'); };
const AI_PROV={gemini:'Gemini','workers-ai':'Llama (backup)',claude:'Claude'};
const aiProvLabel=k=>AI_PROV[k]||'AI';
function aiProvKey(m){ const p=m&&m.provider; if(p) return String(p); return PROVIDER&&PROVIDER.name==='Claude'?'claude':'ai'; }
function aiLiveName(){ const L=ST.ai.last, h=ST.ai.health; const k=L&&L.ok?L.provider:(h&&h.ok?(h.gemini?'gemini':h.workersAi?'workers-ai':null):(PROVIDER&&PROVIDER.name==='Claude'?'claude':null)); return k?aiProvLabel(k):''; }
/* One guarded call: clamps the prompt (9000 for 'plan', 3990 otherwise), aborts after AI_TIMEOUT, records provider/model/ms of the answer in ST.ai.last */
async function aiCallMeta(task,prompt){
  const t0=Date.now(), lim=task==='plan'?9000:3990, ctrl=typeof AbortController==='function'?new AbortController():null, box={}; let tm;
  const rec=(ok,m,err)=>set(s=>{ s.ai.last={task,provider:ok?aiProvKey(m):((m&&m.provider)||null),model:(m&&m.model)||null,ms:Date.now()-t0,ok,err:err||null,at:Date.now()}; });
  PROVIDER.meta=null;
  try{
    const d=await Promise.race([PROVIDER.json(task,String(prompt).slice(0,lim),ctrl&&ctrl.signal,box),new Promise((_,rej)=>{ tm=setTimeout(()=>{ try{ ctrl&&ctrl.abort(); }catch(e){} rej({code:'timeout'}); },AI_TIMEOUT); })]);
    clearTimeout(tm);
    if(!d||typeof d!=='object') throw {code:'invalid_json'};
    const m=box.meta||PROVIDER.meta||{}; rec(true,m); return {d,meta:{provider:aiProvKey(m),model:m.model||null,ms:Date.now()-t0}};
  }catch(e){ clearTimeout(tm); const er=(e&&e.code)?e:{code:'upstream_error'}; rec(false,box.meta||PROVIDER.meta,aiErrText(er)); throw er; }
}
function aiNoteErr(e){ const c=e&&e.code;
  if(['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared','session_expired'].includes(c)) set(s=>{ s.ai.mode='denied'; });
  else if(c==='rate_limited'||c==='queue_overflow') aiBlockedUntil=Date.now()+60000; }
async function aiHealth(){
  if(!AI_URL||(PROVIDER&&PROVIDER.name==='Claude')) return;
  const ctrl=typeof AbortController==='function'?new AbortController():null; const tm=setTimeout(()=>{ try{ ctrl&&ctrl.abort(); }catch(e){} },6000);
  try{ const r=await fetch(AI_URL,{method:'GET',signal:ctrl&&ctrl.signal}); const j=await r.json(); clearTimeout(tm); if(!r.ok||!j) throw 0; set(s=>{ s.ai.health={ok:true,gemini:!!j.gemini,workersAi:!!j.workersAi,version:j.version||null}; }); }
  catch(e){ clearTimeout(tm); set(s=>{ s.ai.health={ok:false}; }); }
}
(async()=>{
  let s=null; try{ if(window.claude&&typeof window.claude.use==='function') s=await window.claude.use('sample'); }catch(e){ s=null; }
  if(s) PROVIDER={name:'Claude',json:(task,p)=>s.json(p,{modelTier:'quick'})};
  else if(AI_URL) PROVIDER={name:'Cloudflare AI',json:async(task,p,signal,box)=>{
    let r; try{ r=await fetch(AI_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task,prompt:p}),signal}); }catch(e){ throw {code:(e&&e.name==='AbortError')?'timeout':'network'}; }
    if(r.status===429) throw {code:'rate_limited'};
    if(r.status===403) throw {code:'not_granted'};

function parseSearch(t0){
  const t=String(t0||'').toLowerCase(); const o={type:'Any',maxPrice:null,pets:false,verified:false,q:null}; let m;
  if(m=t.match(/(\d{2,3})\s?(?:k|к|тыс)/)) o.maxPrice=+m[1]*1000; else if(m=t.match(/(\d{2,3})[\s,.]?000/)) o.maxPrice=+m[1]*1000;
  if(/studio|студи/.test(t)) o.type='Studio'; else if(/dorm|общаг|общежит/.test(t)) o.type='Dormitory';
  else if(/\d[\s-]?(room|комнат)|(одно|дву|тр[её]х)комнатн|flat|apartment|квартир/.test(t)) o.type='Apartment'; else if(/\broom\b|комнат/.test(t)) o.type='Room';
  if(/\bpets?\b|\bcat\b|\bdog\b|кош|кот\b|котик|собак|питом/.test(t)) o.pets=true;
  if(/verified|провер/.test(t)) o.verified=true;
  for(const l of LISTINGS){ const w=l.addr.split(' ')[0].toLowerCase(); if(w.length>3 && t.includes(w)){ o.q=l.addr.split(' ')[0]; break; } }
  return o;
}
const searchSummary = o => [o.maxPrice?`up to ${Math.round(o.maxPrice/1000)}k`:null,o.type!=='Any'?o.type:null,o.pets?'pets OK':null,o.verified?'verified landlords':null,o.q?`near ${o.q}`:null].filter(Boolean).join(' · ')||'all flats';

function offlineAnswer(q){
  const t=q.toLowerCase();
  if(/group|rule|правил|групп|сосед.*правил|house/.test(t)){
    const g=groupStats(); const k=g.risk&&g.risk.k;
    const rule={'Sleep timing':'quiet hours after 23:00 on weekdays, headphones after that','Guests':'tell the flat chat a day before guests come, no overnight guests on weekdays'}[k]||'a shared cleaning rota and a monthly check-in about the flat';
    return {answer:`${g.risk?`The biggest risk in “${ST.group.name}” is ${g.risk.k.toLowerCase()}: ${g.risk.t}`:`“${ST.group.name}” has no big conflicts.`} Suggested rule: ${rule}.`,refs:[]};
  }
  if(/landlord|message|write|letter|письм|владел|напиш|сообщен/.test(t)){
    const l=LISTINGS.find(x=>x.verified&&x.status!=='moderation')||LISTINGS[0]; return {answer:applyFallback({l,grp:true}).message,refs:[l.id]};
  }
  if(/contract|lease|deposit|договор|депозит|аренд/.test(t)){
    return {answer:'In the planned flow the deposit is held in escrow (simulated in this prototype) and released to the landlord only after you check in with photos after moving in. Before you sign, check the term, who is responsible for repairs and what happens if one roommate leaves. Open the contract screen after your application is accepted for a full explanation.',refs:[]};
  }
  if(/flat|room|studio|dorm|housing|rent|price|under|find|\d\s?k\b|жиль|квартир|комнат|студи|общаг|найд|до \d/.test(t)){
    const o=parseSearch(q); const ls=matchFlats(o).slice(0,3);
    return ls.length?{answer:`I found ${matchFlats(o).length} flat${matchFlats(o).length>1?'s':''} for “${searchSummary(o)}”. Best by price and distance: ${ls.map(l=>`${l.title} (${Math.round(l.price/1000)}k, ${l.dist} km)`).join('; ')}.`,refs:ls.map(l=>l.id)}
      :{answer:`No flats match “${searchSummary(o)}”. Try a higher price or any type.`,refs:[]};
  }
  const ids=[...new Set([...ST.matches,...ST.deck])].filter(id=>PEOPLE[id]).sort((a,b)=>score(ST.me,PEOPLE[b])-score(ST.me,PEOPLE[a])).slice(0,3);
  return {answer:'Best fits for you right now: '+ids.map(id=>{const r=reason(id); return `${PEOPLE[id].name} ${score(ST.me,PEOPLE[id])}% (${r.main.replace(/\.$/,'')}${r.warn?`; watch out: ${r.warn}`:''})`;}).join('. ')+'.',refs:ids};
}

function findBudget(text){
  const re=/(\d{1,3}(?:[  ]\d{3})+|\d{1,3}(?:,\d{3})+|\d+(?:[.,]\d)?)\s*(к|k|тыс|тысяч|мың|млн|m)?(?![a-zа-яё])/gi; let m;

    const suf=(m[2]||'').toLowerCase(); let v=parseFloat(m[1].replace(/[  ]/g,'').replace(/,(?=\d{3})/g,'').replace(',','.'));
    const after=text.slice(m.index+m[0].length,m.index+m[0].length+14).toLowerCase(), before=text.slice(Math.max(0,m.index-14),m.index).toLowerCase();

}

/* ---------- city stage ---------- */
function seeded(seed){ let s=seed; return()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
const CAM = ph => ph>=4?{s:1.45,a:-50,b:-22}:ph===3?{s:1.5,a:-50,b:-22}:ph===2?{s:1.75,a:-48,b:-20}:ph===1?{s:1.05,a:-55,b:-30}:{s:1,a:-56,b:-32};
function Box({cls,u,style,children}){ return html`<div class=${'pt '+cls} style=${`--ux:${u.x};--uz:${u.z};--uw:${u.w};--uh:${u.h};${style||''}`}><i class="f fr"></i><i class="f bk"></i><i class="f rt"></i><i class="f lf"></i><i class="f tp"></i>${children}</div>`; }
function netPos(n){ if(n<2) return [[50,50]]; if(n===2) return [[27,60],[73,60]]; return Array.from({length:n},(_,i)=>{ const a=(-90+360*i/n)*Math.PI/180; return [50+32*Math.cos(a),60+27*Math.sin(a)]; }); }

  const aitu={x:.14,z:.02}; const rnd=seeded(11); const fill=[]; for(let i=0;i<60&&fill.length<16;i++){ const x=(rnd()-.5)*.9,z=(rnd()-.5)*.9,w=.04+rnd()*.04,h=.03+rnd()*.1; if(flats.some(f=>Math.hypot(f.x-x,f.z-z)<.12)||Math.hypot(aitu.x-x,aitu.z-z)<.1) continue; fill.push({x,z,w,h}); }
  const b=flats.find(f=>pl.best&&f.r.l.id===pl.best.l.id); const bx=b?b.x:0, bz=b?b.z:0;
  tg.current={ph,bx,bz};
  useEffect(()=>{
    const el=ref.current, w=el.querySelector('.ps-w'); let raf=0; const t0=performance.now(); let ctl=null;
    const ro=window.ResizeObserver?new ResizeObserver(()=>{ const r=el.getBoundingClientRect(); el.style.setProperty('--G',clamp(Math.min(r.width*.5,r.height*1.12),220,470).toFixed(0)+'px'); }):null; ro&&ro.observe(el);
    const place=()=>{ const sr=el.getBoundingClientRect(); el.querySelectorAll('.pa').forEach(a=>{ const l=el.querySelector('.pl2[data-k="'+a.dataset.k+'"]'); if(!l) return; const q=a.getBoundingClientRect(); l.style.transform='translate('+(q.left-sr.left).toFixed(1)+'px,'+(q.top-sr.top).toFixed(1)+'px)'; }); };
    const paint=()=>{ place(); const c=cam.current, u=ctl?ctl.S:{yaw:0,pitch:0,zoom:1}; const lz=Math.max(1,Math.min(1.25,u.zoom)); w.style.setProperty('--s',(c.s*u.zoom).toFixed(3)); w.style.setProperty('--a',Math.max(-90,Math.min(-12,c.a+u.pitch)).toFixed(2)); w.style.setProperty('--b',(c.b+u.yaw).toFixed(2)); el.style.setProperty('--lz',lz.toFixed(3)); const zo=u.zoom<.8?'out':''; if(el.dataset.zoom!==zo) el.dataset.zoom=zo; if(el.dataset.ph>=3) CN3D.dodge(el); w.style.setProperty('--tx',c.x.toFixed(4)); w.style.setProperty('--tz',c.z.toFixed(4)); };

    ctl=CN3D.attach(el,{kind:'plan',init:{yaw:0,pitch:0,zoom:1},limits:{pitch:[-44,30],zoom:[.6,2.2]},sens:{yaw:.45,pitch:.25},topPitch:-40,wheel:'always',auto:{mode:'sway',amp:5,period:5600,idle:3000},apply:(S,ch)=>{ if(rmc&&ch) paint(); }});

      ${flats.map(f=>html`<i class="pa" data-k=${f.r.l.id} style=${`--ux:${f.x};--uz:${f.z};--uh:${f.h}`}></i>`)}<i class="pa" data-k="aitu" style=${`--ux:${aitu.x};--uz:${aitu.z};--uh:.02`}></i>
    </div></div>
    <div class="ps-lb" aria-hidden="true">${flats.map(f=>{ const on=lit.includes(f.r.l.id), isB=ph>=1&&f===b; return html`<span class=${'pl2'+(ph>=1?(on?' on':' show'):'')+(isB?' best':'')} data-k=${f.r.l.id}><i>${isB?'★ '+f.r.fit+'% · ':''}${k0(f.r.l.price)}</i></span>`; })}<span class="pl2 aitu" data-k="aitu"><i>AITU</i></span></div>
    <div class="ps-net" aria-hidden="true"><svg width="100%" height="100%">${pl.edges.map((e,i)=>{ const ia=pl.people.findIndex(x=>x.id===e.a), ib=pl.people.findIndex(x=>x.id===e.b); const c=e.sc>=85?'#6FD6A0':e.sc>=70?'#F6C667':'#FF8A80'; return html`<line pathLength="1" x1=${pos[ia][0]+'%'} y1=${pos[ia][1]+'%'} x2=${pos[ib][0]+'%'} y2=${pos[ib][1]+'%'} stroke=${c} style=${`animation-delay:${.5+i*.15}s;${e.a==='me'?'':'opacity:.6;stroke-width:1.5px'}`}/>`; })}</svg>
