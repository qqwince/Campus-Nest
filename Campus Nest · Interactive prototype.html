<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Nest · Interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#E7E9F6;--page-ink:#17143F;--page-muted:#5B5E86;--page-line:#C9CCE6;--page-card:#F6F7FD;
  --navy:#0B0A2E;--s1:#15124A;--s2:#1E1A66;--s3:#29247F;--line:#2E2A8A;--text:#F2F3FF;--muted:#B9BBE6;
  --primary:#5A63E8;--peri:#8C9EFF;--mint:#6FD6A0;--amber:#F6C667;--lilac:#C3A6F7;--coral:#FF8A80;
  --head:'Unbounded','Onest',system-ui,sans-serif;--body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#06051A;--page-ink:#E8E9FF;--page-muted:#9EA1CF;--page-line:#24215E;--page-card:#100E33;color-scheme:dark;}}
:root[data-theme="dark"]{--page:#06051A;--page-ink:#E8E9FF;--page-muted:#9EA1CF;--page-line:#24215E;--page-card:#100E33;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--page);color:var(--page-ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- stage ---------- */
.stage{display:flex;gap:32px;align-items:flex-start;justify-content:center;padding:28px 24px 40px;min-height:100vh}
.panel{width:290px;flex:none;position:sticky;top:24px}
.panel h1{font-family:var(--head);font-weight:700;font-size:26px;line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.panel p{margin:0 0 18px;color:var(--page-muted);font-size:14px;line-height:1.5}
.seg{display:flex;background:var(--page-card);border:1px solid var(--page-line);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:600;color:var(--page-muted)}
.seg button.on{background:var(--primary);color:#fff}
.jump{margin-top:16px;border-top:1px solid var(--page-line);padding-top:12px;max-height:calc(100vh - 330px);overflow:auto}
.jump h2{font-size:12px;font-weight:600;color:var(--page-muted);margin:12px 0 6px}
.jump button{display:flex;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:8px;font-size:13.5px;color:var(--page-ink)}
.jump button:hover{background:var(--page-card)}
.jump button.cur{background:var(--page-card);font-weight:600}
.jump code{font:600 11.5px var(--body);color:var(--primary);min-width:40px}
.hint{font-size:12.5px;color:var(--page-muted);margin-top:12px;line-height:1.5}
.fab{display:none}

/* ---------- devices ---------- */
.phone{width:390px;height:844px;border-radius:52px;background:#020114;padding:10px;box-shadow:0 30px 80px -30px rgba(20,15,90,.55);flex:none;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--navy);color:var(--text);display:flex;flex-direction:column}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:#020114;z-index:30}
.sbar{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:14px;font-weight:600}
.browser{width:min(1240px,calc(100vw - 380px));height:min(820px,calc(100vh - 56px));min-height:640px;border-radius:16px;background:#020114;padding:0;overflow:hidden;box-shadow:0 30px 80px -30px rgba(20,15,90,.55);display:flex;flex-direction:column;flex:none}
.bbar{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;background:#100E33}
.bbar i{width:11px;height:11px;border-radius:50%;background:#3A3670;display:block}
.url{margin-left:12px;flex:1;max-width:460px;height:28px;border-radius:8px;background:#1C1A4A;color:#B9BBE6;font-size:13px;display:flex;align-items:center;padding:0 12px}
.wscreen{flex:1;display:flex;background:var(--navy);color:var(--text);min-height:0;position:relative}
.side{width:236px;flex:none;background:var(--s1);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side .brand{font-family:var(--head);font-weight:700;font-size:19px;padding:0 10px 4px}
.side .who{font-size:12.5px;color:var(--peri);padding:0 10px 18px}
.side button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;font-size:14.5px;color:var(--muted);text-align:left}
.side button.on{background:rgba(90,99,232,.32);color:var(--text);font-weight:600}
.side button:hover{color:var(--text)}
.wmain{flex:1;display:flex;flex-direction:column;min-width:0}
.wtop{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line)}
.wtop .t{font-family:var(--head);font-weight:500;font-size:20px;flex:1}
.wbody{flex:1;overflow:auto;padding:24px 28px 40px}
.wbody .cnt{max-width:760px}
.wbody .cnt.wide{max-width:none}

/* ---------- app content ---------- */
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:4px 20px 28px}
.top{display:flex;align-items:center;gap:12px;padding:6px 20px 14px}
.top h1,.h1{font-family:var(--head);font-weight:500;font-size:22px;line-height:1.2;margin:0;letter-spacing:-.01em}
.top .sub{font-size:13px;color:var(--muted);margin-top:3px}
.back{width:42px;height:42px;border-radius:50%;background:var(--s1);display:grid;place-items:center;flex:none}
.icon{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--s1);display:grid;place-items:center;position:relative;flex:none}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid var(--s1)}
h3{font-size:15px;font-weight:600;margin:22px 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.flat{border-color:transparent}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list{display:flex;flex-direction:column;gap:10px}
.tap{transition:transform .12s ease}
.tap:active{transform:scale(.98)}
.item{display:flex;align-items:center;gap:14px;background:var(--s1);border-radius:18px;padding:14px;text-align:left;width:100%}
.item .t{font-weight:600;font-size:15px}
.item .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-weight:600;font-size:16px;width:100%;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--primary);color:#fff}
.btn.g{border:1.5px solid var(--primary);color:var(--peri)}
.btn.s{background:var(--s2);color:var(--text)}
.btn.d{border:1.5px solid var(--coral);color:var(--coral)}
.btn.m{background:var(--mint);color:#08251A}
.btn.sm{height:40px;font-size:14px;border-radius:20px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:16px;border:1px solid var(--line);font-size:13px;color:var(--peri);background:transparent;white-space:nowrap}
.chip.on{background:rgba(140,158,255,.22);border-color:var(--peri);color:var(--text)}
.chip.warn{border-color:var(--coral);color:var(--coral)}
.chip.warn.on{background:rgba(255,138,128,.2);color:var(--text)}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.amber.on{background:rgba(246,198,103,.2);color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600}
.pill.mint{background:rgba(111,214,160,.16);color:var(--mint)}
.pill.amber{background:rgba(246,198,103,.16);color:var(--amber)}
.pill.coral{background:rgba(255,138,128,.16);color:var(--coral)}
.pill.peri{background:rgba(140,158,255,.16);color:var(--peri)}
.pill.lilac{background:rgba(195,166,247,.16);color:var(--lilac)}
.ai{background:linear-gradient(160deg,#2A1F6A,#1C1650);border:1px solid rgba(195,166,247,.55);border-radius:16px;padding:12px 14px}
.ai .k{font-size:12px;font-weight:700;color:var(--lilac);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.ai p{margin:0;font-size:13.5px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.inp{height:50px;border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:0 14px;font-size:15px;outline:none;width:100%}
.inp:focus{border-color:var(--peri)}
textarea.inp{height:96px;padding:12px 14px;resize:none}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--mint)}
.switch.on::after{transform:translateX(18px)}
.otp{display:flex;gap:8px}
.otp input{width:46px;height:56px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:center;font-size:22px;font-weight:700;outline:none}
.otp input:focus{border-color:var(--peri)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--mint);transition:width .6s ease}
.kv{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;border-bottom:1px solid rgba(46,42,138,.6)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .h1{color:var(--text);margin-bottom:8px;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:var(--s1);border-radius:16px;padding:12px}
.kpi b{display:block;font-family:var(--head);font-weight:500;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.photo{position:relative;border-radius:16px;overflow:hidden;background:var(--s2)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo .lbl{position:absolute;left:8px;bottom:8px;font-size:11.5px;font-weight:600;background:rgba(11,10,46,.7);padding:3px 8px;border-radius:8px}
.photo .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(11,10,46,.75);display:grid;place-items:center;font-size:14px}
.add{border:1.5px dashed var(--peri);border-radius:16px;display:grid;place-items:center;color:var(--peri);font-size:13px;font-weight:600;cursor:pointer;text-align:center;padding:6px}
.add input{display:none}
.av{border-radius:50%;overflow:hidden;flex:none;background:var(--s2)}
.av img{width:100%;height:100%;display:block}
.stack{display:flex}
.stack .av{border:2px solid var(--s1);margin-left:-10px}
.stack .av:first-child{margin-left:0}
.tag{font-size:11px;font-weight:700;color:var(--peri);opacity:.85}

/* tabbar */
.tabbar{flex:none;height:84px;background:var(--s1);border-top:1px solid var(--line);display:flex;padding:8px 6px 18px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);position:relative}
.tabbar button.on{color:var(--text);font-weight:600}
.tabbar button.on .icon{stroke:var(--peri)}
.tabbar .badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#2A0A0A;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* overlays */
.ov{position:absolute;inset:0;background:rgba(3,2,20,.6);z-index:40;display:flex;align-items:flex-end;animation:fade .2s ease}
.sheet{width:100%;max-height:88%;overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;padding:10px 20px 26px;animation:up .25s ease}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet .h1{margin-bottom:6px}
.web .ov{align-items:center;justify-content:center}
.web .sheet{width:480px;border-radius:24px;max-height:86%}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.toast{position:absolute;left:50%;transform:translateX(-50%);width:max-content;bottom:100px;z-index:60;background:#F2F3FF;color:#12103A;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:86%;text-align:center;animation:up .25s ease}
.web .toast{bottom:32px}
.lb{position:absolute;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
.lb img{flex:1;min-height:0;object-fit:contain;width:100%}
.lb .bar2{display:flex;justify-content:space-between;align-items:center;padding:56px 18px 14px;color:#fff}
.lb .nav{display:flex;justify-content:space-between;padding:14px 18px 30px}
.lb .nav button{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
.ext{position:absolute;inset:0;z-index:80;background:#F4F4F6;color:#1B1B1F;display:flex;flex-direction:column;animation:fade .2s}
.ext .eh{background:#E4002B;color:#fff;padding:56px 20px 18px;font-weight:700;font-size:20px}
.ext .eb{flex:1;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.ext .ecard{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ext .ebtn{height:54px;border-radius:14px;background:#E4002B;color:#fff;font-weight:700;font-size:16px}
.ext.halyk .eh,.ext.halyk .ebtn{background:#00805A}
.ext.egov .eh,.ext.egov .ebtn{background:#1F5BBF}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(0,0,0,.12);border-top-color:currentColor;animation:rot .8s linear infinite;margin:20px auto}
@keyframes rot{to{transform:rotate(360deg)}}

/* swipe */
.deck{position:relative;height:540px;margin:0 20px}
.scard{position:absolute;inset:0;border-radius:28px;background:var(--s1);border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none;display:flex;flex-direction:column}
.scard.under{transform:scale(.95) translateY(14px);opacity:.6}
.scard .ph{height:230px;flex:none;position:relative}
.scard .ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.score{position:absolute;top:14px;right:14px;background:rgba(11,10,46,.82);border:1px solid var(--mint);color:var(--mint);font-weight:700;font-size:14px;padding:6px 12px;border-radius:16px}
.stamp{position:absolute;top:30px;padding:6px 14px;border-radius:10px;font-family:var(--head);font-size:22px;border:3px solid;transform:rotate(-12deg);opacity:0}
.stamp.like{left:20px;color:var(--mint)}
.stamp.nope{right:20px;color:var(--coral);transform:rotate(12deg)}
.sact{display:flex;justify-content:center;gap:26px;margin:16px 0 8px}
.round{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px}
.round.n{border:2px solid var(--coral);color:var(--coral);background:var(--s1)}
.round.y{background:var(--primary);color:#fff}

/* gallery */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:none;width:100%;scroll-snap-align:start}
.dots{display:flex;gap:6px;justify-content:center;position:absolute;bottom:12px;left:0;right:0}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.lcard{background:var(--s1);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-align:left;width:100%}
.lcard .ph{height:170px;position:relative}
.lcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .in{padding:12px 14px 14px}
.heart{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(11,10,46,.72);display:grid;place-items:center}
.heart.on .icon{fill:var(--coral);stroke:var(--coral)}
.promo{position:absolute;top:12px;left:12px}
.price{font-family:var(--head);font-weight:500;font-size:18px}
.mapbox{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);padding:5px 9px;border-radius:12px;background:var(--s1);border:1px solid var(--peri);font-size:12px;font-weight:700;white-space:nowrap}
.pin.on{background:var(--primary);border-color:#fff}
.bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4}
.bubble.in{background:var(--s1);align-self:flex-start;border-bottom-left-radius:6px}
.bubble.out{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.composer{flex:none;display:flex;gap:8px;padding:10px 14px 12px;background:var(--navy);border-top:1px solid var(--line)}
.composer input{flex:1;height:46px;border-radius:23px;background:var(--s1);border:1px solid var(--line);padding:0 16px;outline:none}
.send{width:46px;height:46px;border-radius:50%;background:var(--primary);display:grid;place-items:center;color:#fff}
.step{display:flex;gap:6px;margin:0 20px 16px}
.step i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.step i.on{background:var(--primary)}
.timeline{position:relative;padding-left:26px}
.timeline .tl{position:relative;padding:0 0 18px}
.timeline .tl::before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--navy)}
.timeline .tl::after{content:"";position:absolute;left:-15px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline .tl:last-child::after{display:none}
.timeline .tl.done::before{background:var(--mint);border-color:var(--mint)}
.timeline .tl.now::before{border-color:var(--amber);background:var(--amber)}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;color:var(--line)}
.stars button.on{color:var(--amber)}
.ring{width:150px;height:150px;margin:6px auto 10px;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:40px;font-weight:500}
.slot{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px}
.slot.on{border-color:var(--amber);background:rgba(246,198,103,.15)}
.slot b{display:block;font-size:15px}
.qr{width:150px;height:150px;background:#fff;border-radius:12px;padding:10px;margin:8px auto}
.range2{position:relative;height:30px}
.range2 input{position:absolute;inset:0;width:100%;pointer-events:none;appearance:none;-webkit-appearance:none;background:none;margin:0}
.range2 input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;cursor:pointer}
.range2 input::-moz-range-thumb{pointer-events:auto;width:24px;height:24px;border-radius:50%;background:#fff;border:0;cursor:pointer}
.range2 .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--line)}
.range2 .fill{position:absolute;top:12px;height:6px;border-radius:3px;background:var(--primary)}
.lvl{width:46px;height:46px;border-radius:50%;background:var(--s1);border:1px solid var(--line);font-weight:700}
.lvl.on{background:var(--primary);border-color:var(--primary)}
.acc{border-bottom:1px solid var(--line);padding:14px 0}
.acc summary{font-weight:600;cursor:pointer;list-style:none}
.acc p{color:var(--muted);font-size:14px;line-height:1.5;margin:8px 0 0}

/* web adjustments */
.web .pad{padding:0}
.web .top{display:none}
.web .hide-web{display:none!important}
.web .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.web .split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.web .deck{max-width:420px;margin:0 auto}
.show-web{display:none}
.web .show-web{display:block}

@media (max-width:860px){
  .stage{padding:0;display:block}
  .panel{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .notch{display:none}
  .browser{width:100%;height:100vh;border-radius:0}
  .side{display:none}
  .fab{display:flex;position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:100;gap:6px;background:rgba(6,5,26,.9);border:1px solid #2E2A8A;border-radius:22px;padding:5px}
  .fab button{padding:8px 11px;border-radius:16px;font-size:12px;font-weight:600;color:#B9BBE6}
  .fab button.on{background:#5A63E8;color:#fff}
}

const BASEW = {sleep:1.2,clean:1,smoke:1.3,guests:1,pets:.6,budget:1};
function sims(a,b){
  const ov = Math.max(0, Math.min(a.budget[1],b.budget[1]) - Math.max(a.budget[0],b.budget[0]));
  const rng = Math.min(a.budget[1]-a.budget[0], b.budget[1]-b.budget[0]) || 1;
  return {
    sleep: 1 - Math.abs(a.sleep-b.sleep)/2,
    clean: 1 - Math.abs(a.clean-b.clean)/4,
    smoke: a.smoke===b.smoke ? 1 : (a.smoke==='outside'||b.smoke==='outside') ? .5 : 0,
    guests: 1 - Math.abs(a.guests-b.guests)/2,
    pets: ((a.pets==='none'&&b.pets==='has')||(a.pets==='has'&&b.pets==='none')) ? 0 : 1,
    budget: Math.min(1, ov/rng)
  };
}
function weights(){ const w={}; for(const k in BASEW) w[k]=BASEW[k]*ST.wmul[k]*(ST.notImp[k]?.25:1); return w; }
function score(a,b){ const s=sims(a,b), w=weights(); let n=0,d=0; for(const k in s){n+=s[k]*w[k];d+=w[k];} return Math.round(50+50*n/d); }
const person = id => id==='me' ? ST.me : PEOPLE[id];
function reason(id){
  const p=PEOPLE[id], s=sims(ST.me,p), w=weights();
  const good = Object.keys(s).filter(k=>s[k]>=.8).sort((x,y)=>w[y]-w[x]);
  const bad = Object.keys(s).filter(k=>s[k]<.5).sort((x,y)=>w[y]*(1-s[y])-w[x]*(1-s[x]));
  const txt = {sleep:p.sleep===0?'an early sleeper like you':p.sleep===2?'a night owl like you':'on the same sleep schedule',clean:`tidy (${p.clean}/5), close to your ${ST.me.clean}/5`,smoke:'a non-smoker',guests:`${GUESTS[p.guests].toLowerCase()} has guests, like you`,pets:'fine with pets',budget:`in your budget (${p.budget[0]}–${p.budget[1]}k)`};
  const badT = {sleep:`sleeps ${SLEEP[p.sleep].toLowerCase()}, you sleep ${SLEEP[ST.me.sleep].toLowerCase()}`,clean:`cleanliness ${p.clean}/5 vs your ${ST.me.clean}/5`,smoke:`${SMOKE[p.smoke].toLowerCase()}`,guests:`has guests ${GUESTS[p.guests].toLowerCase()}, you prefer ${GUESTS[ST.me.guests].toLowerCase()}`,pets:'pets do not fit',budget:`budget ${p.budget[0]}–${p.budget[1]}k barely overlaps yours`};
  let main = good.length ? `${p.name} is ${txt[good[0]]}${good[1]?` and ${txt[good[1]]}`:''}.` : `${p.name} differs from you in several habits.`;
  const top = good[0]||bad[0];
  if(top && ST.wmul[top]>1.15 && !ST.notImp[top]) main += ` ${({sleep:'Sleep timing',clean:'Cleanliness',smoke:'Smoking',guests:'Guests',pets:'Pets',budget:'Budget'})[top]} matters more to you than to most students, so it weighs more in your score.`;
  return {main, warn: bad[0] ? badT[bad[0]] : null, warnKey: bad[0], topKey: good[0]};
}
function learn(id, liked){
  const s=sims(ST.me,PEOPLE[id]); let crossed=null;
  for(const k in s){ if(liked && s[k]>=.8){ const b=ST.wmul[k]; ST.wmul[k]=Math.min(1.6,ST.wmul[k]+.1); if(b<=1.15&&ST.wmul[k]>1.15) crossed=k; } if(!liked && s[k]<.5){ ST.wmul[k]=Math.min(1.6,ST.wmul[k]+.06); } }
  return crossed;
}
function groupStats(){
  const ids = ST.group.members; const ps = ids.map(person);
  let tot=0,c=0; for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){tot+=score(ps[i],ps[j]);c++;}
  const comp = c? Math.round(tot/c) : 100;
  const early = ps.filter(p=>p.sleep===0).length, late=ps.filter(p=>p.sleep===2).length;
  let risk=null;
  if(early>0 && late>0) risk={k:'Sleep timing',t:`${early} of ${ps.length} go to bed before 23:00, ${late} after 01:00. Swipes show sleep matters most to ${Math.max(early,2)} members.`};
  else { const gs=ps.map(p=>p.guests); if(Math.max(...gs)-Math.min(...gs)>=2) risk={k:'Guests',t:'One member often has guests while others prefer rarely.'}; }
  const trustAvg = Math.round((ST.trust.score + 74 + 70 + (ids.includes('dana')?73:0)) / (ids.length));
  return {comp, risk, trustAvg: Math.min(99,trustAvg)};
}

      <div class="ecard" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700">${e.kind==='halyk'?'Halyk Visa':'Kaspi Gold'}</div><div style="font-size:13px;color:#666">•••• 4417</div></div><div style="width:22px;height:22px;border-radius:50%;border:6px solid ${e.kind==='halyk'?'#00805A':'#E4002B'}"></div></div>
      <div style="font-size:12.5px;color:#777;line-height:1.5">You are on the bank’s page. Campus Nest never receives your card details.</div>
      <div style="flex:1"></div><button class="ebtn" onClick=${confirm}>Pay ${kzt(e.amount)}</button><button style="color:#666;padding:10px" onClick=${cancel}>Cancel</button>`}
    ${e.step===1&&html`<div class="ecard" style="text-align:center;color:${e.kind==='halyk'?'#00805A':'#E4002B'}"><div class="spin"></div><div style="color:#333">Confirm the payment in the ${bank} app…</div></div>`}
    ${e.step===2&&html`<div class="ecard" style="text-align:center"><div style="font-size:44px;color:#1E9E5A">✓</div><div style="font-weight:700;font-size:18px">Payment successful</div><div style="color:#666;font-size:14px;margin-top:6px">${kzt(e.amount)} · ${e.purpose}</div></div><div style="flex:1"></div><button class="ebtn" onClick=${finish}>Back to Campus Nest</button>`}
  </div></div>`;

function Lightbox(){

const Toast = () => ST.toast ? html`<div class="toast" role="status">${ST.toast}</div>` : null;

<script>
/* ================= SHEETS ================= */
function Sheet(){
  const sh=ST.sheet; if(!sh) return null;
  const S_ = SHEETS[sh.type]; if(!S_) return null;
  return html`<div class="ov" onClick=${e=>{if(e.target===e.currentTarget)closeSheet()}}><div class="sheet" role="dialog"><div class="grab"></div><${S_} ...${sh.p}/></div></div>`;
}
function OtpInput({n=6,onDone,onChange}){
  const refs=useRef([]); const [v,setV]=useState(Array(n).fill(''));
  const upd=(i,val)=>{ const d=val.replace(/\D/g,'').slice(-1); const nv=[...v]; nv[i]=d; setV(nv); onChange&&onChange(nv.join('')); if(d&&i<n-1) refs.current[i+1]?.focus(); if(nv.every(x=>x)&&onDone) onDone(nv.join('')); };
  return html`<div class="otp">${v.map((x,i)=>html`<input inputmode="numeric" aria-label=${'Digit '+(i+1)} maxlength="1" value=${x} ref=${el=>refs.current[i]=el} onInput=${e=>upd(i,e.target.value)} onKeyDown=${e=>{if(e.key==='Backspace'&&!v[i]&&i>0)refs.current[i-1]?.focus();}}/>`)}</div>`;
}
const SHEETS = {
  confirm:({title,text,ok='Confirm',danger,onOk})=>html`<div class="h1">${title}</div><p class="muted" style="line-height:1.5">${text}</p><div class="col" style="margin-top:16px"><button class=${'btn '+(danger?'d':'p')} onClick=${()=>{closeSheet();onOk&&onOk();}}>${ok}</button><button class="btn s" onClick=${closeSheet}>Cancel</button></div>`,
  match:({id})=>html`<div style="text-align:center"><div class="stack" style="justify-content:center;margin:10px 0 14px"><${Av} id="me" size=${84}/><${Av} id=${id} size=${84}/></div><div class="h1" style="font-size:24px">It’s a match</div><p class="muted">You and ${PEOPLE[id].name} liked each other. A chat is open now, end-to-end encrypted.</p><div class="col" style="margin-top:16px"><button class="btn p" onClick=${()=>{closeSheet();nav('M1.2',{id});}}>Say hi to ${PEOPLE[id].name}</button><button class="btn s" onClick=${closeSheet}>Keep swiping</button></div></div>`,
  profile:({id})=>{const p=PEOPLE[id]; const r=reason(id); return html`<div class="row"><${Av} id=${id} size=${64}/><div class="grow"><div class="h1">${p.name}, ${p.age}</div><div class="muted small">${p.uni} · ${p.major}, year ${p.year}</div></div><span class="pill mint">${score(ST.me,p)}%</span></div><p style="line-height:1.5">${p.bio}</p><div class="chips"><span class="chip">${SLEEP[p.sleep]}</span><span class="chip">Tidy ${p.clean}/5</span><span class="chip">${SMOKE[p.smoke]}</span><span class="chip">Guests ${GUESTS[p.guests].toLowerCase()}</span><span class="chip">${p.budget[0]}–${p.budget[1]}k KZT</span><span class="chip">${p.langs.join(', ')}</span></div><div class="row" style="margin-top:14px"><span class="pill mint">${Ic('shield',14)} Student ID verified</span><span class="pill peri">Trust Score ${trustOf(id)}</span></div>${r.warn&&html`<div class="ai" style="margin-top:14px"><div class="k">${Ic('spark',15)} AI conflict check</div><p>${r.warn}.</p></div>`}<button class="btn s" style="margin-top:16px" onClick=${closeSheet}>Close</button>`;},
  filters:()=>html`<div class="h1">Roommate filters</div><p class="muted small">Dealbreakers hide people completely. AI never overrides them.</p><h3>Dealbreakers</h3><div class="chips">${[['smoking','Smoking'],['late','Night owls'],['pets','Pets at home'],['guests','Frequent guests']].map(([k,l])=>html`<button class=${'chip warn'+(ST.me.dealbreakers.includes(k)?' on':'')} onClick=${()=>set(s=>{const d=s.me.dealbreakers;s.me.dealbreakers=d.includes(k)?d.filter(x=>x!==k):[...d,k];})}>${l}</button>`)}</div><h3>Ignored by AI</h3>${Object.keys(ST.notImp).filter(k=>ST.notImp[k]).length? html`<div class="chips">${Object.keys(ST.notImp).filter(k=>ST.notImp[k]).map(k=>html`<button class="chip on" onClick=${()=>set(s=>{s.notImp[k]=false})}>${k} · restore</button>`)}</div>` : html`<p class="muted small">Nothing yet. Tap “Not important to me” under an AI reason to lower a factor.</p>`}<div class="row" style="margin-top:18px"><div class="grow"><b>Use AI matching</b><div class="muted small">Off: plain filters, no learned weights</div></div><${Sw} on=${!ST.aiOff} onClick=${()=>set(s=>{s.aiOff=!s.aiOff})}/></div><button class="btn p" style="margin-top:18px" onClick=${closeSheet}>Show roommates</button>`,
  slots:({lid})=>{const L=LISTINGS.find(x=>x.id===lid); const slots=[['Sat','14:00'],['Sun','11:00'],['Mon','18:30'],['Tue','19:00']]; return html`<div class="h1">Book a viewing</div><p class="muted small">${L.title}, ${L.addr}. Slots come from the landlord’s calendar.</p><div class="grid2" style="margin:14px 0">${slots.map(([d,t])=>{const v=d+' '+t; return html`<button class=${'slot'+(ST.viewing[lid]===v?' on':'')} onClick=${()=>set(s=>{s.viewing[lid]=v})}><b>${d}</b>${t}</button>`;})}</div><button class="btn p" disabled=${!ST.viewing[lid]} onClick=${()=>{closeSheet();toast('Viewing booked: '+ST.viewing[lid]+'. Serik will get a notification.');}}>Book viewing</button>`;},
  sign:()=>{const [m,setM]=useState('totp'); const [st,setSt]=useState(0); const done=()=>{closeSheet();signMine();}; return html`<div class="h1">Sign the contract</div><p class="muted small">Your signature is legally binding. Choose how to confirm it.</p><div class="chips" style="margin:12px 0 16px"><button class=${'chip'+(m==='totp'?' on':'')} onClick=${()=>setM('totp')}>Authenticator code</button><button class=${'chip'+(m==='egov'?' on':'')} onClick=${()=>setM('egov')}>eGov digital signature</button></div>${m==='totp'? html`<div class="field"><label>6-digit code from your authenticator app</label><${OtpInput} onDone=${()=>{setSt(1);setTimeout(done,900);}}/></div>${st===1&&html`<div class="pill mint">${Ic('check',14)} Code verified, signing…</div>`}<p class="muted small">Tip: type any 6 digits in this prototype.</p>` : html`<p class="muted small" style="line-height:1.5">You will be redirected to eGov Mobile. Campus Nest only receives the signed document.</p><button class="btn p" onClick=${()=>{closeSheet();egov('Lease contract CN-2026-0412',signMine);}}>Continue to eGov</button>`}`;},
  reset:()=>{const [sent,setSent]=useState(false); return html`<div class="h1">Reset password</div>${sent? html`<p style="line-height:1.5">We sent a reset link to <b>aruzhan@astanait.edu.kz</b>. After you open it, we will ask for your authenticator code.</p><button class="btn p" onClick=${closeSheet}>Done</button>` : html`<p class="muted small">Enter the email you signed up with.</p><div class="field"><input class="inp" value="aruzhan@astanait.edu.kz" aria-label="Email"/></div><button class="btn p" onClick=${()=>setSent(true)}>Send reset link</button>`}`;},
  guest:()=>html`<div class="h1">Log in to apply</div><p class="muted" style="line-height:1.5">Guests can browse listings. To apply, book viewings or chat, create an account. It takes two minutes.</p><div class="col" style="margin-top:14px"><button class="btn p" onClick=${()=>{closeSheet();set(s=>{s.guest=false;s.stack.student=[{id:'P0'},{id:'P4'}]});}}>Create account</button><button class="btn g" onClick=${()=>{closeSheet();set(s=>{s.guest=false;s.stack.student=[{id:'P0'},{id:'P3'}]});}}>Log in</button></div>`,
  report:({who})=>{const [r,setR]=useState(null); return html`<div class="h1">Report ${who||'this message'}</div><p class="muted small">Moderators see only the reported messages, not the whole chat.</p><div class="col" style="margin:12px 0">${['Asks to pay outside Campus Nest','Fake listing or scam','Harassment','Spam'].map(x=>html`<button class=${'item'+(r===x?' on':'')} style=${r===x?'outline:2px solid var(--coral)':''} onClick=${()=>setR(x)}><span class="grow">${x}</span>${r===x&&Ic('check',18)}</button>`)}</div><button class="btn d" disabled=${!r} onClick=${()=>{closeSheet();toast('Reported. A moderator will review it within 24 hours.');}}>Send report</button>`;},
  dispute:()=>{const [r,setR]=useState('Damage not shown in the listing'); const [t,setT]=useState(''); const n=Object.keys(ST.checkin.photos).length; return html`<div class="h1">Open a dispute</div><p class="muted small">The deposit stays in escrow until a moderator decides, within 5 working days.</p><div class="field" style="margin-top:12px"><label>Reason</label><select class="inp" onChange=${e=>setR(e.target.value)}>${['Damage not shown in the listing','Flat does not match the photos','Appliances do not work','Other'].map(x=>html`<option selected=${x===r}>${x}</option>`)}</select></div><div class="field"><label>What happened</label><textarea class="inp" placeholder="Describe the problem" value=${t} onInput=${e=>setT(e.target.value)}></textarea></div><div class="pill ${n?'mint':'amber'}" style="margin-bottom:14px">${n?`${n} check-in photos attached as evidence`:'Add check-in photos first: they are your evidence'}</div><button class="btn d" disabled=${!n} onClick=${()=>{closeSheet();set(s=>{s.checkin.dispute={r,at:'today'};});toast('Dispute opened. Deposit is frozen until a decision.');}}>Open dispute</button>`;},
  topup:()=>{const [a,setA]=useState(5000); return html`<div class="h1">Top up wallet</div><p class="muted small">Wallet money is used only for promotion.</p><div class="grid3" style="margin:14px 0">${[2000,5000,10000].map(v=>html`<button class=${'slot'+(a===v?' on':'')} onClick=${()=>setA(v)}><b>${fmt(v)}</b>KZT</button>`)}</div><button class="btn p" onClick=${()=>pay({amount:a,purpose:'Wallet top-up',onDone:()=>{set(s=>{s.ll.wallet+=a});toast('Wallet topped up by '+kzt(a));}})}>Top up ${kzt(a)}</button>`;},
  promote:({lid})=>{const [pk,setPk]=useState('top'); const P={top:['Top of search, 7 days',1500],hl:['Highlighted card, 7 days',900],feat:['Featured near campus, 14 days',2500]}; const cool = ST.ll.refreshAt>Date.now(); const L=LISTINGS.find(x=>x.id===lid); return html`<div class="h1">Promote listing</div><p class="muted small">${L.title}</p><div class="card flat" style="margin:12px 0;background:var(--s2)"><div class="between"><div><b>Free refresh</b><div class="muted small">${cool?'Used. Available again in 3 days':'Shows students you are actively looking'}</div></div><button class="btn sm g" disabled=${cool} onClick=${()=>{set(s=>{s.ll.refreshAt=Date.now()+3*864e5});toast('Listing refreshed. It moved up in search.');}}>Refresh</button></div></div><h3>Paid promotion</h3><div class="col">${Object.entries(P).map(([k,[n,p]])=>html`<button class="item" style=${pk===k?'outline:2px solid var(--amber)':''} onClick=${()=>setPk(k)}><span class="grow"><span class="t">${n}</span><div class="s">${kzt(p)} from wallet</div></span>${pk===k&&Ic('check',18)}</button>`)}</div><div class="between" style="margin:14px 0"><span class="muted">Wallet balance</span><b>${kzt(ST.ll.wallet)}</b></div>${ST.ll.wallet>=P[pk][1]? html`<button class="btn p" onClick=${()=>{set(s=>{s.ll.wallet-=P[pk][1];s.ll.promo[lid]=P[pk][0];});closeSheet();toast('Promotion started: '+P[pk][0]);}}>Pay ${kzt(P[pk][1])} and promote</button>` : html`<button class="btn g" onClick=${()=>sheet('topup')}>Top up wallet first</button>`}`;},
  iban:()=>{const [v,setV]=useState('KZ86 125K ZT50 0410 0100'); return html`<div class="h1">Change payout details</div><div class="ai" style="margin:10px 0 14px;border-color:var(--amber);background:rgba(246,198,103,.08)"><div class="k" style="color:var(--amber)">${Ic('shield',15)} Safety hold</div><p>After you change the IBAN, payouts pause for 48 hours. This protects you if someone takes over your account.</p></div><div class="field"><label>New IBAN</label><input class="inp" value=${v} onInput=${e=>setV(e.target.value)}/></div><button class="btn p" onClick=${()=>{closeSheet();set(s=>{s.ll.ibanHold=true});toast('IBAN saved. Payouts paused for 48 hours.');}}>Save IBAN</button>`;},
  reject:({aid})=>{const [r,setR]=useState('Already rented'); return html`<div class="h1">Reject application</div><p class="muted small">Students see the reason. Be polite and clear.</p><div class="chips" style="margin:12px 0 16px">${['Already rented','Group is too big','Dates do not fit','Requirements not met'].map(x=>html`<button class=${'chip'+(r===x?' on':'')} onClick=${()=>setR(x)}>${x}</button>`)}</div><button class="btn d" onClick=${()=>{closeSheet();setApp(aid,'rejected');toast('Application rejected. The students were notified.');}}>Reject application</button>`;},
  review:({target})=>{const [n,setN]=useState(5); const tags=['Clean flat','Quiet neighbours','Fast replies','As in photos','Fair deposit']; const [t,setT]=useState(['As in photos']); return html`<div class="h1">Review ${target||'your stay'}</div><p class="muted small">You can review only after a real contract. This keeps reviews honest.</p><div class="stars" style="margin:14px 0">${[1,2,3,4,5].map(i=>html`<button class=${i<=n?'on':''} aria-label=${i+' stars'} onClick=${()=>setN(i)}>★</button>`)}</div><div class="chips">${tags.map(x=>html`<button class=${'chip'+(t.includes(x)?' on':'')} onClick=${()=>setT(t.includes(x)?t.filter(y=>y!==x):[...t,x])}>${x}</button>`)}</div><div class="field" style="margin-top:14px"><textarea class="inp" placeholder="Anything else future tenants should know?"></textarea></div><button class="btn p" onClick=${()=>{closeSheet();toast('Review published. Thank you!');}}>Publish review</button>`;},
  pwd:()=>html`<div class="h1">Change password</div><div class="field" style="margin-top:12px"><label>Current password</label><input class="inp" type="password" value="password1"/></div><div class="field"><label>New password</label><input class="inp" type="password" placeholder="At least 10 characters"/></div><button class="btn p" onClick=${()=>{closeSheet();toast('Password changed. Other devices were signed out.');}}>Change password</button>`,
  del:()=>{const [v,setV]=useState(''); return html`<div class="h1">Delete account</div><p class="muted" style="line-height:1.5">Your profile, matches and documents will be deleted. Contracts are kept for 5 years as the law requires.</p><div class="field"><label>Type DELETE to confirm</label><input class="inp" value=${v} onInput=${e=>setV(e.target.value)}/></div><button class="btn d" disabled=${v!=='DELETE'} onClick=${()=>{closeSheet();toast('Account deletion requested. You have 14 days to change your mind.');}}>Delete my account</button>`;},
  doc:({kind})=>html`<div class="h1">${kind}</div><p class="muted small">Upload a clear photo or PDF. A moderator checks it, usually within a day. Scans of IDs are deleted after the check.</p><div style="margin:14px 0"><${AddPhoto} h=${120} label="Choose file" accept="image/*,.pdf" onFiles=${()=>{closeSheet();toast(kind+' uploaded. Status: pending review.');}}/></div>`
};

/* ================= PUBLIC ================= */

  return html`<div class="body"><div style="height:330px;position:relative"><img src=${room('exterior',1)} alt="" style="width:100%;height:100%;object-fit:cover"/><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,46,0) 35%,var(--navy) 100%)"></div></div>
  <div class="pad" style="margin-top:-70px;position:relative">
    <div style="font-family:var(--head);font-weight:700;font-size:44px;line-height:1">Campus<br/><span style="color:var(--peri)">Nest</span></div>
    <p class="muted" style="font-size:17px;line-height:1.45;margin:14px 0 22px">A flat near your university and roommates whose habits match yours.</p>
    <div class="list">
      ${[['users','Roommates by habits','Sleep, cleanliness, guests: not luck','var(--peri)'],['shield','Verified landlords','ID and ownership checked','var(--mint)'],['lock','Deposit held by a bank','Released only after you move in','var(--amber)']].map(([i,t,s,c])=>html`<div class="row"><div class="tile" style=${`background:color-mix(in srgb, ${c} 20%, transparent);color:${c}`}>${Ic(i)}</div><div><div style="font-weight:600">${t}</div><div class="muted small">${s}</div></div></div>`)}

}

  return html`<div class="body"><${Top} title="Log in"/><div class="pad">

    <div class="field"><label>Code from your authenticator app</label><${OtpInput} onChange=${setCode}/></div>

    <button class="btn p" onClick=${login}>Log in</button>
    <div class="muted small" style="text-align:center;margin:14px 0">or</div>
    <div class="col"><button class="btn s" onClick=${()=>{set(s=>{s.stack.student=[{id:'S0'}]});toast('Signed in with Google');}}>Continue with Google</button><button class="btn s" onClick=${()=>{set(s=>{s.stack.student=[{id:'S0'}]});toast('Signed in with Apple');}}>Continue with Apple</button></div>
  </div></div>`;
}
function P4(){
  const o=ST.onb; const up=f=>set(s=>{f(s.onb)});
  const steps=['Role','Contacts','2FA',o.role==='student'?'Student card':'ID'];
  const [sent,setSent]=useState(false);
  const next=()=>{ if(o.step<3) up(x=>{x.step++}); else { if(o.role==='student'){ set(s=>{s.stack.student=[{id:'S0'},{id:'S1.1',p:{first:true}}]}); toast('Account created. Tell us about your lifestyle.'); } else { set(s=>{s.role='landlord';s.stack.landlord=[{id:'L0'},{id:'L5'}]}); toast('Account created. Verify your identity to publish listings.'); } up(x=>{x.step=0}); } };
  const ok = [true, o.codes, o.tfa, !!o.card][o.step];
  return html`<div class="body"><${Top} title="Create account" sub=${`Step ${o.step+1} of 4 · ${steps[o.step]}`}/><div class="step">${steps.map((_,i)=>html`<i class=${i<=o.step?'on':''}></i>`)}</div><div class="pad">
    ${o.step===0&&html`<h3 style="margin-top:0">I am a…</h3><div class="grid2">${[['student','Student','Find a flat and roommates','users','var(--peri)'],['landlord','Landlord','Rent out a flat or rooms','house','var(--mint)']].map(([k,t,s,i,c])=>html`<button class="card tap" style=${`text-align:left;${o.role===k?'border-color:var(--primary);border-width:2px':''}`} onClick=${()=>up(x=>{x.role=k})}><div class="tile" style=${`background:color-mix(in srgb, ${c} 22%, transparent);color:${c};margin-bottom:12px`}>${Ic(i)}</div><b>${t}</b><div class="muted small" style="margin-top:4px">${s}</div></button>`)}</div><p class="muted small" style="margin-top:16px;line-height:1.5">One role per account. By continuing you accept the Terms and Privacy Policy. Your data is stored in Kazakhstan.</p>`}

  const url='campusnest.kz/'+(m.auth?'':ST.role+'/')+c.id.toLowerCase().replace('.','-');
  return html`<div class="browser"><div class="bbar"><i></i><i></i><i></i><div class="url">${Ic('lock',13)} <span style="margin-left:6px">${url}</span></div></div>
    <div class="wscreen web">${m.auth? html`<div class="wmain" style="align-items:center;overflow:auto"><div style="width:440px;padding:30px 0;display:flex;flex-direction:column;min-height:100%"><${C} key=${c.id}/></div></div>`
    : html`<aside class="side"><div class="brand">Campus Nest</div><div class="who">${ST.role==='student'?'Student':'Landlord'} · web</div>${SIDE[ST.role].map(([id,l,i])=>html`<button class=${st[0].id===id&&st.length===1||c.id===id?'on':''} onClick=${()=>root(id)}>${Ic(i,19)}${l}${id==='M1.1'&&unreadAll()>0&&html`<span class="pill coral" style="margin-left:auto">${unreadAll()}</span>`}</button>`)}</aside>
      <div class=${'wmain'+(m.wide?' wide':'')}><div class="wtop">${st.length>1&&html`<button class="back" aria-label="Back" onClick=${back}>${Ic('back',20)}</button>`}<div class="t">${m.t}</div>${ST.role==='student'&&html`<button class="iconbtn" aria-label="Notifications" onClick=${()=>nav('M2.1')}>${Ic('bell')}${ST.notifs.some(n=>!n.read)&&html`<span class="dot"></span>`}</button>`}<${Av} id=${ST.role==='student'?'me':'serik'} size=${38}/></div>
      <div class="wbody" style=${m.full?'display:flex;flex-direction:column;padding:0 28px;overflow:hidden':''}><div class=${'cnt'+(m.wide?' wide':'')} style=${m.full?'flex:1;display:flex;flex-direction:column;min-height:0;max-width:760px;width:100%':''}><${C} key=${c.id+JSON.stringify(c.p||{})}/></div></div></div>`}
    <${Overlays}/></div></div>`;
}
const GROUPS = [['Public',['P0','P3','P4']],['Student',['S0','S1.1','S1.2','S1.3','S3.2','S2.1','S2.3','S2.4','S4.1','S4.3','M3.1','S5.1','S5.2','S6.1','S7']],['Landlord',['L0','L1','L1.1','L1.6','L2','L2.1','L2.2','L3','L4','L5','L7']],['Shared modules',['M1.1','M1.2','M2.1','M2.2','M5.1','M5.2','M6.1']]];
function jump(id){ const m=SCREENS[id]; set(s=>{ if(m.r!=='any') s.role=m.r; s.sheet=null; s.ext=null; s.lb=null; const st=s.stack[s.role]; if(m.auth){ s.role='student'; s.stack.student=[{id:'P0'},...(id==='P0'?[]:[{id}])]; } else { const dp = id==='M1.2' ? {id:s.role==='landlord'?'L:dorm':'group'} : (DEF[id]||{}); s.stack[s.role]=[{id:s.role==='student'?'S0':'L0'},...((id==='S0'||id==='L0')?[]:[{id,p:dp}])]; } }); scrollTop(); }
function Panel(){
  const c=cur();
  return html`<aside class="panel"><h1>Campus Nest</h1><p>Interactive prototype · ICT Endterm, SE-2617. Every button works: tap, swipe, upload your own photos.</p>
    <div class="seg"><button class=${ST.role==='student'?'on':''} onClick=${()=>switchRole('student')}>Student</button><button class=${ST.role==='landlord'?'on':''} onClick=${()=>switchRole('landlord')}>Landlord</button></div>
    <div class="seg"><button class=${ST.device==='phone'?'on':''} onClick=${()=>set(s=>{s.device='phone'})}>Mobile app</button><button class=${ST.device==='web'?'on':''} onClick=${()=>set(s=>{s.device='web'})}>Website</button></div>
    <div class="jump">${GROUPS.map(([g,ids])=>html`<h2>${g}</h2>${ids.map(id=>html`<button class=${c.id===id?'cur':''} onClick=${()=>jump(id)}><code>${id}</code>${SCREENS[id].t}</button>`)}`)}</div>
    <div class="hint">Try the main path: Welcome → Create account → Roommates (swipe) → Housing → Apply as a group → switch to Landlord and accept → sign → pay → check in.</div></aside>`;
}
function Fab(){ return html`<div class="fab"><button class=${ST.role==='student'?'on':''} onClick=${()=>switchRole('student')}>Student</button><button class=${ST.role==='landlord'?'on':''} onClick=${()=>switchRole('landlord')}>Landlord</button><button class=${ST.device==='web'?'on':''} onClick=${()=>set(s=>{s.device=s.device==='web'?'phone':'web'})}>Web</button></div>`; }
function App(){
  const [,f]=useState(0); useEffect(()=>{const s=()=>f(x=>x+1);subs.add(s);return()=>subs.delete(s)},[]);
  return html`<div class="stage"><${Panel}/>${ST.device==='phone'?html`<${Phone}/>`:html`<${Web}/>`}<${Fab}/></div>`;
}
render(html`<${App}/>`, document.getElementById('app'));
</script>
